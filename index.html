  // ---------- Cruscotto (Titolare) ----------
  function renderCruscotto(){
    ensureLoaded('Checklist_Log');
    ensureLoaded('Scorte');
    ensureLoaded('Manutenzione');
    ensureLoaded('Utenti');
    ensureLoaded('Turni');
    ensureLoaded('Ferie');
    var log = state.cache.Checklist_Log, scorte = state.cache.Scorte, manut = state.cache.Manutenzione,
      users = state.cache.Utenti, turni = state.cache.Turni, ferie = state.cache.Ferie;
    var addBtnFerie = '';
    if (!log || !scorte || !manut || !users || !turni || !ferie) {
      return '<div>' + renderTopBarWithAction('Cruscotto', addBtnFerie) + '<div class="center-loading">Calcolo i dati…</div></div>';
    }

    var counts = {};
    users.forEach(function(u){
      var nome = val(u,'nome');
      if (nome) counts[nome] = { checklist: 0, risolte: 0 };
    });
    log.forEach(function(l){
      var n = val(l,'dipendente');
      if (n && counts[n]) counts[n].checklist++;
    });
    scorte.concat(manut).forEach(function(r){
      var n = val(r,'risolto da');
      if (n && counts[n]) counts[n].risolte++;
    });
    var list = Object.keys(counts).map(function(n){
      var c = counts[n];
      return { nome: n, checklist: c.checklist, risolte: c.risolte, totale: c.checklist + c.risolte };
    }).sort(function(a,b){ return b.totale - a.totale; });
    var max = Math.max(1, list.length ? list[0].totale : 1);

    var lbHtml = list.map(function(l){
      var pct = Math.round(l.totale / max * 100);
      return '<div class="lb-row"><div class="lb-name">' + esc(l.nome) + '</div>' +
        '<div class="lb-count">' + l.checklist + ' checklist · ' + l.risolte + ' risolte</div>' +
        '<div class="lb-bar-track"><div class="lb-bar-fill" style="width:' + pct + '%;"></div></div></div>';
    }).join('');

    function weekKeyFor(dataStr){ return fmtDate(mondayOf(parseDate(dataStr))); }
    var weeks = {};
    function ensureWeek(key){
      if (!weeks[key]) weeks[key] = {};
      return weeks[key];
    }
    var months = {};
    function ensureMonth(key){
      if (!months[key]) months[key] = {};
      return months[key];
    }
    turni.forEach(function(r){
      var dataStr = String(val(r,'data')).slice(0,10);
      var nome = String(val(r,'dipendente')||'').trim();
      var oi = parseHourStr(val(r,'ora inizio'));
      var of = parseHourStr(val(r,'ora fine'));
      if (!dataStr || !nome || oi == null || of == null || of <= oi) return;
      var m = ensureMonth(dataStr.slice(0,7));
      m[nome] = (m[nome] || 0) + (of - oi);
    });
    ferie.forEach(function(r){
      var dataStr = String(val(r,'data')).slice(0,10);
      var nome = String(val(r,'dipendente')||'').trim();
      if (!dataStr || !nome) return;
      var idField = findKey(r,'ID');
      var id = r[idField];
      var w = ensureWeek(weekKeyFor(dataStr));
      if (!w[nome]) w[nome] = [];
      w[nome].push({ data: dataStr, id: id });
    });

    var monthKeys = Object.keys(months).sort(function(a,b){ return b.localeCompare(a); });
    var monthBody = monthKeys.length ? monthKeys.map(function(key){
      var parts = key.split('-');
      var label = MESI_SHORT[parseInt(parts[1],10)-1] + ' ' + parts[0];
      var m = months[key];
      var nameList = Object.keys(m).sort(function(a,b){ return a.localeCompare(b); });
      var rowsHtml = nameList.map(function(nome){
        var c = personColor(nome);
        return '<div class="summary-person"><div class="summary-person-head"><span><span class="summary-dot" style="background:' + c.bg + ';"></span>' + esc(nome) + '</span>' +
          '<span class="summary-total">' + m[nome] + ' h</span></div></div>';
      }).join('');
      return '<div class="section-label">' + esc(label) + '</div>' + rowsHtml;
    }).join('') : '<div class="empty-hint">Ancora nessun dato.</div>';

    var weekKeys = Object.keys(weeks).sort(function(a,b){ return b.localeCompare(a); });
    var ferieBody;
    if (!weekKeys.length) ferieBody = '<div class="empty-state">Nessuna feria ancora segnata.</div>';
    else {
      ferieBody = weekKeys.map(function(key){
        var w = weeks[key];
        var monday = parseDate(key);
        var sunday = addDays(monday, 6);
        var label = fmtDayLabel(monday) + ' – ' + fmtDayLabel(sunday);
        var nameList = Object.keys(w).sort(function(a,b){ return a.localeCompare(b); });
        var rowsHtml = nameList.map(function(nome){
          var c = personColor(nome);
          var ferieChips = w[nome].map(function(f){
            var d = parseDate(f.data);
            var lbl = GIORNI_LABELS[(d.getDay()+6)%7] + ' ' + d.getDate();
            var click = f.id ? ' onclick="App.removeFerie(\'' + esc(f.id) + '\',\'' + esc(nome).replace(/'/g,"\\'") + '\',\'' + lbl + '\')"' : '';
            return '<span class="ferie-chip"' + click + '>🌴 ' + lbl + '</span>';
          }).join('');
          return '<div class="summary-person"><div class="summary-person-head"><span><span class="summary-dot" style="background:' + c.bg + ';"></span>' + esc(nome) + '</span></div>' +
            '<div style="margin-top:8px;">' + ferieChips + '</div>' +
            '</div>';
        }).join('');
        return '<div class="section-label">' + esc(label) + '</div>' + rowsHtml;
      }).join('');
    }

    return '<div>' + renderTopBarWithAction('Cruscotto', addBtnFerie) +
      '<div class="lb-card">' + (lbHtml || '<div class="empty-hint">Ancora nessun dato.</div>') + '</div>' +
      '<div class="oreferie-title">Ore del mese</div>' + monthBody +
      '<div class="oreferie-title">Ferie e assenze</div>' +
      '<button class="btn-submit" onclick="App.goto(\'assenze\')">🌴 Apri Ferie e permessi</button>' +
      (weekKeys.length ? '<div class="section-label" style="margin-top:20px;">Ferie segnate con il vecchio sistema</div>' + ferieBody : '') +
      '</div>';
  }

  // ---------- Pianificatore turni (solo titolare/responsabili) ----------
  var PL_COLORI = {
    giallo:  { bg:'#fdf3c4', bd:'#efd36a', fg:'#5c4a00' },
    verde:   { bg:'#e3f5d7', bd:'#a9d98b', fg:'#2f5a14' },
    azzurro: { bg:'#dcecfb', bd:'#94c2ee', fg:'#14456e' },
    lilla:   { bg:'#e8e3fa', bd:'#b8aaf0', fg:'#3b2c80' },
    rosa:    { bg:'#fbe1ea', bd:'#eea6be', fg:'#7a2343' },
    arancio: { bg:'#fde6d4', bd:'#f3b183', fg:'#7a3a0c' },
  };
  var PL_COLORI_KEYS = Object.keys(PL_COLORI);
  var TIPI = [ { k:'fisso', l:'Fisso' }, { k:'extra', l:'Extra' }, { k:'chiamata', l:'A chiamata' } ];

  function tipoOf(u){
    var t = String(val(u,'tipo')||'').toLowerCase();
    if (t.indexOf('chiamata') !== -1) return 'chiamata';
    if (t.indexOf('extra') !== -1) return 'extra';
    return 'fisso';
  }
  function tipoLabel(k){ var t = TIPI.find(function(x){ return x.k === k; }); return t ? t.l : 'Fisso'; }
  function fmtOre(h){ return String(Math.round(h*10)/10).replace('.', ','); }
  function plDays(){
    var ws = parseDate(state.turniWeekStart), a = [];
    for (var i=0;i<7;i++) a.push(addDays(ws, i));
    return a;
  }
  function plModelli(){
    return (state.cache.Turni_Modello || [])
      .filter(function(m){ return String(val(m,'nome')||'').trim(); })
      .map(function(m){
        return { id: m[findKey(m,'ID')], nome: String(val(m,'nome')).trim(), oi: parseHourStr(val(m,'ora inizio')),
          of: parseHourStr(val(m,'ora fine')), colore: String(val(m,'colore')||'').trim().toLowerCase() };
      })
      .filter(function(m){ return m.oi != null && m.of != null; })
      .sort(function(a,b){ return a.oi - b.oi || a.nome.localeCompare(b.nome); });
  }
  function plColor(modello, oi){
    var m = modello ? plModelli().find(function(x){ return x.nome.toLowerCase() === String(modello).toLowerCase(); }) : null;
    if (m && PL_COLORI[m.colore]) return PL_COLORI[m.colore];
    if (oi < 12) return PL_COLORI.giallo;
    if (oi < 17) return PL_COLORI.azzurro;
    return PL_COLORI.lilla;
  }
  function plShiftsOf(nome, dateStr){
    var key = String(nome).trim().toLowerCase();
    return (state.cache.Turni || []).filter(function(r){
      return String(val(r,'data')).slice(0,10) === dateStr && String(val(r,'dipendente')||'').trim().toLowerCase() === key;
    }).map(function(r){
      return { id: r[findKey(r,'ID')], oi: parseHourStr(val(r,'ora inizio')), of: parseHourStr(val(r,'ora fine')),
        modello: String(val(r,'modello')||'').trim() };
    }).filter(function(s){ return s.oi != null && s.of != null; })
      .sort(function(a,b){ return a.oi - b.oi; });
  }
  // Assenza approvata (nuovo sistema "Ferie e permessi") o ferie del vecchio foglio Ferie
  function plAssenzaDi(nome, dateStr){
    var a = state.cache.Assenze ? asOn(nome, dateStr, false)[0] : null;
    if (a) {
      var col = asColore(a.tipo);
      return { label: asEmoji(a.tipo) + ' ' + a.tipo + (a.dalle ? ' ' + a.dalle + '–' + a.alle : ''), tipo: a.tipo, col: col };
    }
    var key = String(nome).trim().toLowerCase();
    var old = (state.cache.Ferie || []).some(function(r){
      return String(val(r,'data')).slice(0,10) === dateStr && String(val(r,'dipendente')||'').trim().toLowerCase() === key;
    });
    return old ? { label: '🌴 Ferie', tipo: 'Ferie', col: null } : null;
  }
  function plHasFerie(nome, dateStr){ return !!plAssenzaDi(nome, dateStr); }
  function plAssenzaHtml(nome, dateStr, cls){
    var a = plAssenzaDi(nome, dateStr);
    if (!a) return '';
    var st = a.col ? ' style="background:' + a.col.bg + ';color:' + a.col.fg + ';"' : '';
    return '<div class="' + cls + '"' + st + '>' + esc(a.label) + '</div>';
  }
  function plPeople(dates){
    var ORD = { fisso:0, extra:1, chiamata:2 };
    var people = (state.cache.Utenti || []).filter(function(u){ return String(val(u,'nome')||'').trim(); }).map(function(u){
      return { nome: String(val(u,'nome')).trim(), tipo: tipoOf(u), ruolo: normRole(val(u,'ruolo')),
        ore: parseFloat(String(val(u,'ore contratto')||'').replace(',','.')) || 0,
        tel: String(val(u,'telefono')||''), gf: String(val(u,'giorni ferie anno')||''), op: String(val(u,'ore permesso anno')||''), inFoglio: true };
    });
    // Chi ha turni in settimana ma non è nel foglio Utenti (es. extra scritti a mano)
    var known = people.map(function(p){ return p.nome.toLowerCase(); });
    (state.cache.Turni || []).forEach(function(r){
      var n = String(val(r,'dipendente')||'').trim();
      if (n && dates.indexOf(String(val(r,'data')).slice(0,10)) !== -1 && known.indexOf(n.toLowerCase()) === -1) {
        known.push(n.toLowerCase());
        people.push({ nome: n, tipo: 'extra', ruolo: 'dipendente', ore: 0, tel: '', inFoglio: false });
      }
    });
    return people.sort(function(a,b){ return (ORD[a.tipo] - ORD[b.tipo]) || a.nome.localeCompare(b.nome); });
  }

  // ro = sola lettura (dipendenti): vedono i turni di tutti ma non possono modificarli
  var PL_RO = false;
  function renderPlanner(ro){
    PL_RO = !!ro;
    var me = state.user.nome;
    ['Turni','Utenti','Ferie','Turni_Modello','Assenze','Tipi_Assenza','Richieste_Turno','Eventi'].forEach(function(s){ ensureLoaded(s); });
    if (ro) { ensureLoaded('Note_Turni'); if (state.cache.Turni) setSeen('Turni', rowsLatestTs(state.cache.Turni, false)); }
    var rtN = state.cache.Richieste_Turno ? rtPending().length : 0;
    var days = plDays();
    var dates = days.map(fmtDate);
    var t = todayStr();
    var titolo = ro ? 'Turni' : 'Pianificatore turni';
    var extra = ro ? renderMieRichiesteTurno() + renderNotePreferenze() : '';
    var weekNav = '<div class="week-nav nav-center"><button class="week-nav-btn" onclick="App.shiftWeek(-1)">‹</button>' +
      '<div class="week-nav-label">' + esc(fmtDayLabel(days[0])) + ' – ' + esc(fmtDayLabel(days[6])) + '</div>' +
      '<button class="week-nav-btn" onclick="App.shiftWeek(1)">›</button></div>';
    var actions = ro ? '<div class="pl-actions"><button class="pl-btn pl-btn-primary" onclick="App.rtOpen()">📝 Chiedi un turno alla titolare</button></div>' : '<div class="pl-actions">' +
      '<button class="pl-btn" onclick="App.plOpenPersona(-1)">+ Persona</button>' +
      '<button class="pl-btn" onclick="App.plOpenModelli()">🎨 Turni modello</button>' +
      '<button class="pl-btn" onclick="App.rtOpenLista()">📝 Richieste turno' + (rtN ? '<span class="as-count">' + rtN + '</span>' : '') + '</button>' +
      '<button class="pl-btn pl-btn-primary" onclick="App.plNotifica()">📣 Avvisa lo staff</button></div>';

    var c = state.cache;
    var body;
    if (!c.Turni || !c.Utenti || !c.Ferie || !c.Turni_Modello || !c.Assenze || !c.Tipi_Assenza) body = '<div class="center-loading">Carico il pianificatore…</div>';
    else {
      var people = plPeople(dates);
      if (ro) {
        // La propria riga in cima
        var mi = people.findIndex(function(p){ return p.nome.toLowerCase() === me.toLowerCase(); });
        if (mi > 0) people.unshift(people.splice(mi, 1)[0]);
      }
      state.plPeople = people;
      if (ro) actions += plMiaSettimana(people, dates);
      if (plIsPhone()) return '<div>' + renderTopBar(titolo) + weekNav + actions + renderPlannerPhone(people, dates, t) + extra + '</div>';
      var dayTot = dates.map(function(){ return { persone: 0, ore: 0 }; });
      var head = '<tr><th class="pl-name-h">Persone</th>' + days.map(function(d){
        var ds = fmtDate(d);
        var ev = evDi(ds);
        return '<th class="' + (ds === t ? 'pl-today' : '') + '">' + GIORNI_LABELS[(d.getDay()+6)%7] + ' ' + d.getDate() +
          (ev.length ? '<div class="pl-ev" title="' + esc(ev.map(function(e){ return e.titolo; }).join(', ')) + '">📅 ' + esc(ev[0].titolo) + (ev.length > 1 ? ' +' + (ev.length - 1) : '') + '</div>' : '') + '</th>';
      }).join('') + '</tr>';

      var rowsHtml = people.map(function(p, pi){
        var oreSett = 0;
        var cells = dates.map(function(ds, di){
          var shifts = plShiftsOf(p.nome, ds);
          if (shifts.length) dayTot[di].persone++;
          var html = plAssenzaHtml(p.nome, ds, 'pl-ferie') + rtBadge(p.nome, ds);
          html += shifts.map(function(s){
            var ore = s.of - s.oi;
            oreSett += ore; dayTot[di].ore += ore;
            var col = plColor(s.modello, s.oi);
            if (ro) return '<div class="pl-shift" style="background:' + col.bg + ';border-color:' + col.bd + ';color:' + col.fg + ';">' +
              '<div class="pl-shift-time">' + hourLabel(s.oi) + ' – ' + hourLabel(s.of) + '</div>' +
              (s.modello ? '<div class="pl-shift-name">' + esc(s.modello) + '</div>' : '') + '</div>';
            return '<button class="pl-shift" draggable="true" ondragstart="App.plDragStart(event,' + pi + ',\'' + ds + '\',\'' + esc(s.id) + '\')" ondragend="App.plDragEnd()" style="background:' + col.bg + ';border-color:' + col.bd + ';color:' + col.fg + ';" onclick="App.plOpenTurno(' + pi + ',\'' + ds + '\',\'' + esc(s.id) + '\')">' +
              '<div class="pl-shift-time">' + hourLabel(s.oi) + ' – ' + hourLabel(s.of) + '</div>' +
              (s.modello ? '<div class="pl-shift-name">' + esc(s.modello) + '</div>' : '') + '</button>';
          }).join('');
          if (ro) return '<td class="pl-cell' + (ds === t ? ' pl-cell-today' : '') + '">' + (html || '<div class="pl-rest">Riposo</div>') + '</td>';
          html += '<button class="pl-add" title="Aggiungi turno" onclick="App.plOpenTurno(' + pi + ',\'' + ds + '\',\'\')">+</button>';
          return '<td class="pl-cell' + (ds === t ? ' pl-cell-today' : '') + '" ondragover="App.plDragOver(event)" ondragleave="App.plDragLeave(event)" ondrop="App.plDrop(event,' + pi + ',\'' + ds + '\')">' + html + '</td>';
        }).join('');

        var oreHtml;
        if (p.ore) {
          var diff = oreSett - p.ore;
          var cls = diff > 0 ? 'pl-over' : diff < 0 ? 'pl-under' : 'pl-ok';
          oreHtml = '<span>' + fmtOre(oreSett) + ' / ' + fmtOre(p.ore) + ' h</span><span class="' + cls + '">' + (diff > 0 ? '+' : '') + fmtOre(diff) + '</span>';
        } else {
          oreHtml = '<span>' + fmtOre(oreSett) + ' h</span>';
        }
        var tipoBadge = p.tipo !== 'fisso' ? '<span class="pl-tipo pl-tipo-' + p.tipo + '">' + tipoLabel(p.tipo) + '</span>' : '';
        if (ro) {
          var sonoIo = p.nome.toLowerCase() === me.toLowerCase();
          return '<tr' + (sonoIo ? ' class="pl-me"' : '') + '><td class="pl-name" style="cursor:default;"><div class="pl-person">' + esc(p.nome) + (sonoIo ? ' <span class="pl-tu">tu</span>' : '') + '</div>' +
            '<div class="pl-meta">' + tipoBadge + (sonoIo ? '<span>' + fmtOre(oreSett) + ' h</span>' : '') + '</div></td>' + cells + '</tr>';
        }
        return '<tr><td class="pl-name" onclick="App.plOpenPersona(' + pi + ')"><div class="pl-person">' + esc(p.nome) + '</div>' +
          '<div class="pl-meta">' + tipoBadge + oreHtml + '</div></td>' + cells + '</tr>';
      }).join('');

      var foot = '<tr class="pl-foot"><td class="pl-name">In turno</td>' + dayTot.map(function(x){
        return '<td>' + x.persone + ' pers · ' + fmtOre(x.ore) + ' h</td>';
      }).join('') + '</tr>';

      body = people.length
        ? '<div class="pl-wrap"><table class="pl-grid"><thead>' + head + '</thead><tbody>' + rowsHtml + foot + '</tbody></table></div>' +
          '<div class="turni-hint">' + (ro ? 'Qui vedi i turni di tutto lo staff. Hai un impegno? Usa "Chiedi un turno alla titolare".' :
            'Tocca + per aggiungere un turno · tocca un turno per modificarlo · <b>trascina un turno</b> su un\'altra casella per spostarlo o duplicarlo · tocca un nome per i dati della persona') + '</div>'
        : '<div class="empty-state">' + (ro ? 'Nessun turno ancora.' : 'Nessuna persona ancora. Aggiungila con "+ Persona".') + '</div>';
    }
    return '<div>' + renderTopBar(titolo) + weekNav + actions + body + extra + '</div>';
  }

  // -- Riquadro "La tua settimana" (dipendente): ore previste, giorni, contratto, differenza --
  function plMiaSettimana(people, dates){
    var me = state.user.nome.toLowerCase();
    var p = people.find(function(x){ return x.nome.toLowerCase() === me; }) || { nome: state.user.nome, ore: 0 };
    var ore = plOreSett(p.nome, dates);
    var giorni = dates.filter(function(ds){ return plShiftsOf(p.nome, ds).length; }).length;
    // Mese di riferimento: quello in cui cade il giovedì della settimana mostrata
    var ym = dates[3].slice(0, 7), mese = MESI_LUNGHI[+ym.slice(5, 7) - 1].toLowerCase();
    var oreMese = plOreSett(p.nome, rpGiorniMese(ym));
    var box = 'background:rgba(20,15,40,0.035);';
    return '<div class="as-card" style="margin-top:14px;"><div class="as-title" style="font-size:15px;">Le tue ore</div>' +
      '<div class="rp-kpis" style="margin-top:10px;grid-template-columns:repeat(3,1fr);">' +
      '<div class="rp-kpi" style="' + box + '"><b>' + fmtOre(ore) + ' h</b><span>previste questa settimana</span></div>' +
      '<div class="rp-kpi" style="' + box + '"><b>' + giorni + '</b><span>giorni di lavoro</span></div>' +
      '<div class="rp-kpi" style="' + box + '"><b>' + fmtOre(oreMese) + ' h</b><span>totale di ' + mese + '</span></div></div></div>';
  }

  // -- Vista telefono: una persona alla volta, giorni in verticale --
  function plIsPhone(){ return window.matchMedia && window.matchMedia('(max-width:700px)').matches; }
  function plOreSett(nome, dates){
    return dates.reduce(function(sum, ds){
      return sum + plShiftsOf(nome, ds).reduce(function(s2, s){ return s2 + (s.of - s.oi); }, 0);
    }, 0);
  }
  function plOreHtml(p, ore){
    if (!p.ore) return '<span>' + fmtOre(ore) + ' h in settimana</span>';
    var diff = ore - p.ore;
    var cls = diff > 0 ? 'pl-over' : diff < 0 ? 'pl-under' : 'pl-ok';
    return '<span>' + fmtOre(ore) + ' / ' + fmtOre(p.ore) + ' h</span><span class="' + cls + '">' + (diff > 0 ? '+' : '') + fmtOre(diff) + '</span>';
  }
  function plSelectPerson(pi){
    var p = state.plPeople && state.plPeople[pi];
    if (p) { state.plSel = p.nome; render(); }
  }
  function renderPlannerPhone(people, dates, t){
    if (!people.length) return '<div class="empty-state">Nessuna persona ancora. Aggiungila con "+ Persona".</div>';
    var me = state.user.nome.toLowerCase();
    var selIdx = people.findIndex(function(p){ return p.nome === state.plSel; });
    if (selIdx < 0) {
      selIdx = PL_RO ? Math.max(0, people.findIndex(function(p){ return p.nome.toLowerCase() === me; })) : 0;
      state.plSel = people[selIdx].nome;
    }
    var chips = people.map(function(p, pi){
      var ore = plOreSett(p.nome, dates), io = p.nome.toLowerCase() === me;
      var sotto = PL_RO ? (io ? fmtOre(ore) + ' h' : (p.tipo !== 'fisso' ? tipoLabel(p.tipo) : 'Collega')) :
        fmtOre(ore) + (p.ore ? ' / ' + fmtOre(p.ore) : '') + ' h' + (p.tipo !== 'fisso' ? ' · ' + tipoLabel(p.tipo) : '');
      return '<button class="plm-chip' + (pi === selIdx ? ' plm-chip-active' : '') + '" onclick="App.plSelectPerson(' + pi + ')">' +
        '<div class="plm-chip-name">' + esc(p.nome) + (PL_RO && io ? ' (tu)' : '') + '</div>' +
        '<div class="plm-chip-ore">' + sotto + '</div></button>';
    }).join('');
    var p = people[selIdx], pIo = p.nome.toLowerCase() === me;
    var head = '<div class="plm-head"><div><div class="plm-head-name">' + esc(p.nome) + '</div>' +
      '<div class="plm-head-ore">' + (p.tipo !== 'fisso' ? '<span class="pl-tipo pl-tipo-' + p.tipo + '">' + tipoLabel(p.tipo) + '</span>' : '') +
      (PL_RO ? (pIo ? '<span>' + fmtOre(plOreSett(p.nome, dates)) + ' h in settimana</span>' : '') : plOreHtml(p, plOreSett(p.nome, dates))) + '</div></div>' +
      (PL_RO ? '' : '<button class="pl-btn" onclick="App.plOpenPersona(' + selIdx + ')">Dati</button>') + '</div>';
    var list = dates.map(function(ds){
      var d = parseDate(ds);
      var shifts = plShiftsOf(p.nome, ds);
      var inTurno = people.filter(function(x){ return plShiftsOf(x.nome, ds).length; }).length;
      var html = plAssenzaHtml(p.nome, ds, 'plm-ferie') + rtBadge(p.nome, ds);
      html += shifts.map(function(s){
        var col = plColor(s.modello, s.oi);
        var tag = PL_RO ? 'div' : 'button';
        return '<' + tag + ' class="plm-shift" style="background:' + col.bg + ';border-color:' + col.bd + ';color:' + col.fg + ';"' +
          (PL_RO ? '' : ' onclick="App.plOpenTurno(' + selIdx + ',\'' + ds + '\',\'' + esc(s.id) + '\')"') + '>' +
          '<div class="plm-shift-time">' + hourLabel(s.oi) + ' – ' + hourLabel(s.of) + '</div>' +
          '<div class="plm-shift-name">' + esc(s.modello || 'Orario personalizzato') + '</div></' + tag + '>';
      }).join('');
      var empty = !shifts.length && !plHasFerie(p.nome, ds);
      if (PL_RO) { if (empty) html += '<div class="plm-ferie" style="background:transparent;border:1px dashed rgba(20,15,40,0.15);color:var(--text-muted3);font-weight:600;">Riposo</div>'; }
      else html += '<button class="plm-add' + (empty ? ' plm-add-empty' : '') + '" onclick="App.plOpenTurno(' + selIdx + ',\'' + ds + '\',\'\')">' + (empty ? 'Riposo · + Aggiungi turno' : '+ Aggiungi turno') + '</button>';
      return '<div class="plm-day' + (ds === t ? ' plm-day-today' : '') + '">' +
        '<div class="plm-day-label">' + GIORNI_LABELS[(d.getDay()+6)%7] + ' ' + d.getDate() +
        '<div class="plm-day-sub">' + inTurno + ' in turno</div>' +
        evDi(ds).map(function(e){ return '<div class="pl-ev" style="margin:4px 0 0;max-width:50px;" title="' + esc(e.titolo) + '">📅 ' + esc(e.titolo) + '</div>'; }).join('') + '</div>' +
        '<div class="plm-day-body">' + html + '</div></div>';
    }).join('');
    return '<div class="plm-people">' + chips + '</div>' + head + '<div class="plm-list">' + list + '</div>';
  }
  // Se la finestra passa da "computer" a "telefono" (o viceversa) ridisegna il pianificatore
  var plWasPhone = null;
  window.addEventListener('resize', function(){
    var now = plIsPhone() + '|' + (window.innerWidth >= 900) + '|' + (window.innerWidth >= 768);
    if (plWasPhone !== null && now !== plWasPhone && state.screen !== 'login' && !state.activeModal) render();
    plWasPhone = now;
  });

  // -- Turno: nuovo / modifica --
  function plOpenTurno(pi, ds, id){
    var p = state.plPeople && state.plPeople[pi];
    if (!p) return;
    var s = id ? plShiftsOf(p.nome, ds).find(function(x){ return String(x.id) === String(id); }) : null;
    state.plEdit = { id: id || '', nome: p.nome, data: ds, oi: s ? s.oi : 9, of: s ? s.of : 15, modello: s ? s.modello : '', dup: [] };
    state.activeModal = 'pl_turno';
    render();
  }
  function plPickModello(idx){
    var m = plModelli()[idx], e = state.plEdit;
    if (!m || !e) return;
    e.oi = m.oi; e.of = m.of; e.modello = m.nome;
    if (!e.id) { plSaveTurno(); return; } // nuovo turno: un tocco e si salva
    render();
  }
  function plSetOra(which, h){
    var e = state.plEdit;
    if (!e) return;
    e[which] = h;
    e.modello = ''; // orario personalizzato
    if (e.of <= e.oi) {
      if (which === 'oi') e.of = Math.min(HOUR_END, e.oi + 1); else e.oi = Math.max(HOUR_START, e.of - 1);
    }
    render();
  }
  function plAfterSave(sheet){
    return function(res){
      state.busy = false;
      if (res && res.error) { if (!res.auth) alert(res.error); render(); return; }
      closeModal();
      reload(sheet);
    };
  }
  function plSaveTurno(){
    var e = state.plEdit;
    if (!e || state.busy) return;
    if (e.of <= e.oi) { alert("L'ora di fine deve essere dopo l'ora di inizio"); return; }
    var overlap = plShiftsOf(e.nome, e.data).some(function(s){ return String(s.id) !== String(e.id) && s.oi < e.of && e.oi < s.of; });
    if (overlap && !confirm(e.nome + ' ha già un turno che si sovrappone in questo giorno. Salvare comunque?')) return;
    var ass = !e.id ? plAssenzaDi(e.nome, e.data) : null;
    if (ass && !confirm(e.nome + ' quel giorno è assente (' + ass.tipo + '). Salvare comunque?')) return;
    var data = { 'Ora inizio': hourLabel(e.oi), 'Ora fine': hourLabel(e.of), Modello: e.modello || '' };
    var req;
    if (e.id) req = { sheet: 'Turni', action: 'update', id: e.id, data: data };
    else {
      data.Data = e.data; data.Dipendente = e.nome; data.Note = ''; data['Creato da'] = state.user.nome;
      req = { sheet: 'Turni', data: data };
    }
    state.busy = true;
    render();
    apiPost(req).then(plAfterSave('Turni'));
  }
  // -- Conflitti: sovrapposizioni e assenze --
  function plConflitto(nome, data, oi, of, exceptId){
    var msgs = [];
    if (plShiftsOf(nome, data).some(function(s){ return String(s.id) !== String(exceptId) && s.oi < of && oi < s.of; })) {
      msgs.push(nome + ' ' + rtGiorno(data) + ' ha già un turno che si sovrappone.');
    }
    var a = plAssenzaDi(nome, data);
    if (a) msgs.push(nome + ' ' + rtGiorno(data) + ' è assente (' + a.tipo + ').');
    return msgs.join('\n');
  }
  function plTurnoSalvato(e){
    return plShiftsOf(e.nome, e.data).find(function(s){ return String(s.id) === String(e.id); });
  }

  // -- Trascina e rilascia (computer) --
  function plDragStart(ev, pi, ds, id){
    state.plDrag = { pi: pi, ds: ds, id: id };
    try { ev.dataTransfer.effectAllowed = 'copyMove'; ev.dataTransfer.setData('text/plain', String(id)); } catch(e){}
  }
  function plDragOver(ev){
    if (!state.plDrag) return;
    ev.preventDefault();
    ev.currentTarget.classList.add('pl-drop-over');
  }
  function plDragLeave(ev){ ev.currentTarget.classList.remove('pl-drop-over'); }
  function plDragEnd(){
    state.plDrag = null;
    Array.prototype.forEach.call(document.querySelectorAll('.pl-drop-over'), function(el){ el.classList.remove('pl-drop-over'); });
  }
  function plDrop(ev, pi, ds){
    ev.preventDefault();
    ev.currentTarget.classList.remove('pl-drop-over');
    var d = state.plDrag;
    state.plDrag = null;
    if (!d || (d.pi === pi && d.ds === ds)) return;
    var src = state.plPeople[d.pi], dst = state.plPeople[pi];
    if (!src || !dst) return;
    var s = plShiftsOf(src.nome, d.ds).find(function(x){ return String(x.id) === String(d.id); });
    if (!s) return;
    state.plDrop = { id: s.id, oi: s.oi, of: s.of, modello: s.modello, daNome: src.nome, daData: d.ds, aNome: dst.nome, aData: ds };
    state.activeModal = 'pl_drop';
    render();
  }
  function plDropAzione(tipo){
    var x = state.plDrop;
    if (!x || state.busy) return;
    var c = plConflitto(x.aNome, x.aData, x.oi, x.of, tipo === 'move' ? x.id : null);
    if (c && !confirm(c + '\n\nProcedere comunque?')) return;
    var req = tipo === 'move'
      ? { sheet: 'Turni', action: 'update', id: x.id, data: { Data: x.aData, Dipendente: x.aNome } }
      : { sheet: 'Turni', data: { Data: x.aData, 'Ora inizio': hourLabel(x.oi), 'Ora fine': hourLabel(x.of), Dipendente: x.aNome,
          Modello: x.modello || '', Note: '', 'Creato da': state.user.nome } };
    state.busy = true;
    render();
    apiPost(req).then(plAfterSave('Turni'));
  }

  // -- Duplica su altri giorni / Sposta (computer e telefono) --
  function plToggleDup(ds){
    var e = state.plEdit;
    if (!e) return;
    var i = e.dup.indexOf(ds);
    if (i === -1) e.dup.push(ds); else e.dup.splice(i, 1);
    render();
  }
  function plDuplica(){
    var e = state.plEdit;
    if (!e || !e.id || !e.dup.length || state.busy) return;
    var s = plTurnoSalvato(e);
    if (!s) return;
    var targets = [], saltati = [];
    e.dup.slice().sort().forEach(function(ds){
      var a = plAssenzaDi(e.nome, ds);
      if (plShiftsOf(e.nome, ds).some(function(x){ return x.oi === s.oi && x.of === s.of; })) saltati.push(rtGiorno(ds) + ' (c\'era già)');
      else if (a) saltati.push(rtGiorno(ds) + ' (' + a.tipo + ')');
      else targets.push(ds);
    });
    if (!targets.length) { alert('Nessun giorno da aggiungere:\n' + saltati.join('\n')); return; }
    state.busy = true;
    render();
    var chain = Promise.resolve({ ok: true });
    targets.forEach(function(ds){
      chain = chain.then(function(prev){
        if (prev && prev.error) return prev;
        return apiPost({ sheet: 'Turni', data: { Data: ds, 'Ora inizio': hourLabel(s.oi), 'Ora fine': hourLabel(s.of), Dipendente: e.nome,
          Modello: s.modello || '', Note: '', 'Creato da': state.user.nome } });
      });
    });
    chain.then(function(res){
      plAfterSave('Turni')(res);
      if (res && res.ok && saltati.length) setTimeout(function(){ alert('Turno duplicato su ' + targets.length + ' giorn' + (targets.length === 1 ? 'o' : 'i') + '.\nSaltati:\n' + saltati.join('\n')); }, 250);
    });
  }
  function plSpostaA(ds){
    var e = state.plEdit;
    if (!e || !e.id || state.busy || ds === e.data) return;
    var s = plTurnoSalvato(e);
    if (!s) return;
    var c = plConflitto(e.nome, ds, s.oi, s.of, s.id);
    if (c && !confirm(c + '\n\nSpostare comunque?')) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Turni', action: 'update', id: s.id, data: { Data: ds } }).then(plAfterSave('Turni'));
  }

  function plDeleteTurno(){
    var e = state.plEdit;
    if (!e || !e.id || state.busy) return;
    if (!confirm('Eliminare il turno di ' + e.nome + ' (' + hourLabel(e.oi) + '–' + hourLabel(e.of) + ')?')) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Turni', action: 'delete', id: e.id }).then(plAfterSave('Turni'));
  }

  // -- Persona: fisso / extra / a chiamata --
  function plOpenPersona(pi){
    var p = pi >= 0 && state.plPeople ? state.plPeople[pi] : null;
    state.plPersona = p
      ? { orig: p.inFoglio ? p.nome : '', nome: p.nome, tipo: p.tipo, ruolo: p.ruolo, ore: p.ore ? String(p.ore) : '', tel: p.tel, gf: p.gf || '', op: p.op || '' }
      : { orig: '', nome: '', tipo: 'extra', ruolo: 'dipendente', ore: '', tel: '', gf: '', op: '' };
    state.activeModal = 'pl_persona';
    render();
  }
  function plPersonaField(k, v){ if (state.plPersona) state.plPersona[k] = v; }
  function plPersonaChip(k, v){ if (state.plPersona) { state.plPersona[k] = v; render(); } }
  function plSavePersona(){
    var p = state.plPersona;
    if (!p || state.busy) return;
    var nome = String(p.nome || '').trim();
    if (!nome) { alert('Scrivi il nome'); return; }
    var data = { Tipo: p.tipo, Ruolo: p.tipo === 'fisso' ? p.ruolo : 'dipendente',
      'Ore contratto': String(p.ore || '').trim(), Telefono: String(p.tel || '').trim(),
      'Giorni ferie anno': String(p.gf || '').trim(), 'Ore permesso anno': String(p.op || '').trim() };
    var req;
    if (p.orig) req = { sheet: 'Utenti', action: 'update', matchField: 'Nome', matchValue: p.orig, data: data };
    else {
      var exists = (state.cache.Utenti || []).some(function(u){ return String(val(u,'nome')||'').trim().toLowerCase() === nome.toLowerCase(); });
      if (exists) { alert('Esiste già una persona con questo nome.'); return; }
      data.Nome = nome;
      req = { sheet: 'Utenti', data: data };
    }
    state.busy = true;
    render();
    apiPost(req).then(plAfterSave('Utenti'));
  }
  function plDeletePersona(){
    var p = state.plPersona;
    if (!p || !p.orig || state.busy) return;
    if (p.orig.toLowerCase() === state.user.nome.toLowerCase()) { alert('Non puoi rimuovere il tuo stesso profilo.'); return; }
    if (!confirm('Rimuovere ' + p.orig + ' dallo staff? I turni già inseriti restano.')) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Utenti', action: 'delete', matchField: 'Nome', matchValue: p.orig }).then(plAfterSave('Utenti'));
  }

  // -- Turni modello --
  function plOpenModelli(){
    state.plModello = { nome: '', oi: 9, of: 15, colore: 'giallo' };
    state.activeModal = 'pl_modelli';
    render();
  }
  function plModelloField(k, v){ if (state.plModello) state.plModello[k] = v; }
  function plModelloSet(k, v){
    var m = state.plModello;
    if (!m) return;
    m[k] = v;
    if (k === 'oi' && m.of <= m.oi) m.of = Math.min(HOUR_END, m.oi + 1);
    if (k === 'of' && m.of <= m.oi) m.oi = Math.max(HOUR_START, m.of - 1);
    render();
  }
  function plSaveModello(){
    var m = state.plModello;
    if (!m || state.busy) return;
    var nome = String(m.nome || '').trim();
    if (!nome) { alert('Dai un nome al turno modello (es. "Cena weekend")'); return; }
    if (plModelli().some(function(x){ return x.nome.toLowerCase() === nome.toLowerCase(); })) { alert('Esiste già un turno modello con questo nome.'); return; }
    state.busy = true;
    render();
    apiPost({ sheet: 'Turni_Modello', data: { Nome: nome, 'Ora inizio': hourLabel(m.oi), 'Ora fine': hourLabel(m.of), Colore: m.colore } })
      .then(function(res){
        state.busy = false;
        if (res && res.error) { if (!res.auth) alert(res.error); render(); return; }
        state.plModello = { nome: '', oi: m.oi, of: m.of, colore: m.colore };
        reload('Turni_Modello');
      });
  }
  function plDeleteModello(idx){
    var m = plModelli()[idx];
    if (!m || !m.id || state.busy) return;
    if (!confirm('Eliminare il turno modello "' + m.nome + '"? I turni già inseriti restano.')) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Turni_Modello', action: 'delete', id: m.id }).then(function(res){
      state.busy = false;
      if (res && res.error) { if (!res.auth) alert(res.error); render(); return; }
      reload('Turni_Modello');
    });
  }

  // -- Notifica "turni pronti" --
  function plNotifica(){
    var d = plDays();
    if (!confirm('Mandare una notifica a chi ha turni dal ' + fmtDayLabel(d[0]) + ' al ' + fmtDayLabel(d[6]) + '?')) return;
    apiPost({ action: 'notifica_turni', dal: fmtDate(d[0]), al: fmtDate(d[6]) }).then(function(res){
      if (!res || res.error) { if (!(res && res.auth)) alert((res && res.error) || 'Errore'); return; }
      if (!res.inviati) alert('Nessuno ha turni in questa settimana.');
      else if (!res.notificheAttive) alert('Le notifiche non sono ancora attive (manca la chiave OneSignal). Persone con turni: ' + res.inviati + '.');
      else alert('Notifica inviata a ' + res.inviati + ' persone.');
    });
  }

  function plHourChips(sel, from, to, fn, which){
    var h = '';
    for (var x = from; x <= to; x++) {
      h += '<button class="chip-select ' + (sel === x ? 'chip-select-active' : '') + '" onclick="App.' + fn + '(\'' + which + '\',' + x + ')">' + hourLabel(x) + '</button>';
    }
    return '<div class="chips-wrap">' + h + '</div>';
  }

  function plDupHtml(e){
    var days = plDays().map(fmtDate).filter(function(ds){ return ds !== e.data; });
    var dupChips = days.map(function(ds){
      return '<button class="chip-select ' + (e.dup.indexOf(ds) !== -1 ? 'chip-select-active' : '') + '" onclick="App.plToggleDup(\'' + ds + '\')">' + rtGiorno(ds) + '</button>';
    }).join('');
    var moveChips = days.map(function(ds){
      return '<button class="chip-select" onclick="App.plSpostaA(\'' + ds + '\')">' + rtGiorno(ds) + '</button>';
    }).join('');
    return '<div class="pl-dup-box"><div class="field-label">📋 Duplica questo turno su altri giorni (tocca i giorni)</div><div class="chips-wrap">' + dupChips + '</div>' +
      (e.dup.length ? '<button class="btn-submit" style="margin:0 0 12px;" onclick="App.plDuplica()">📋 Duplica su ' + e.dup.length + ' giorn' + (e.dup.length === 1 ? 'o' : 'i') + '</button>' : '') +
      '<div class="field-label">↔️ Oppure sposta il turno a</div><div class="chips-wrap">' + moveChips + '</div></div>';
  }

  function renderPlannerModal(type){
    if (state.busy) return '<div class="overlay"><div class="sheet"><div class="center-loading">Salvataggio in corso…</div></div></div>';
    var open = '<div class="overlay" onclick="App.closeModal()"><div class="sheet" onclick="event.stopPropagation()">';
    var close = '</div></div>';
    function header(title){
      return '<div class="sheet-header"><div class="sheet-title">' + title + '</div><button class="btn-close" onclick="App.closeModal()">&times;</button></div>';
    }
    function modelBtn(m, i, active, onclick, extra){
      var c = PL_COLORI[m.colore] || PL_COLORI.giallo;
      return '<' + (onclick ? 'button' : 'div') + ' class="pl-model" style="background:' + c.bg + ';border-color:' + (active ? c.fg : c.bd) + ';color:' + c.fg + ';' +
        (active ? 'box-shadow:inset 0 0 0 1px ' + c.fg + ';' : '') + '"' + (onclick ? ' onclick="' + onclick + '"' : '') + '>' +
        '<span><span class="pl-model-name">' + esc(m.nome) + '</span> <span class="pl-model-time">· ' + hourLabel(m.oi) + ' – ' + hourLabel(m.of) + '</span></span>' +
        (extra || '') + '</' + (onclick ? 'button' : 'div') + '>';
    }

    if (type === 'pl_turno') {
      var e = state.plEdit, d = parseDate(e.data);
      var modelli = plModelli();
      var mHtml = modelli.length ? '<div class="pl-model-list">' + modelli.map(function(m, i){
        var active = !!e.modello && e.modello.toLowerCase() === m.nome.toLowerCase();
        return modelBtn(m, i, active, 'App.plPickModello(' + i + ')');
      }).join('') + '</div>' : '<div class="empty-hint" style="padding:10px 0;">Nessun turno modello: creali con "🎨 Turni modello".</div>';
      return open + header(e.id ? 'Modifica turno' : 'Nuovo turno') +
        '<div class="pl-sub">' + esc(e.nome) + ' · ' + GIORNI_LABELS[(d.getDay()+6)%7] + ' ' + d.getDate() + ' ' + MESI_SHORT[d.getMonth()] + '</div>' +
        '<div class="field-label">' + (e.id ? 'Turno modello' : 'Tocca un turno modello per inserirlo subito') + '</div>' + mHtml +
        '<div class="field-label">Oppure orario personalizzato · dalle</div>' + plHourChips(e.oi, HOUR_START, HOUR_END - 1, 'plSetOra', 'oi') +
        '<div class="field-label">fino alle</div>' + plHourChips(e.of, HOUR_START + 1, HOUR_END, 'plSetOra', 'of') +
        '<button class="btn-submit" onclick="App.plSaveTurno()">' + (e.id ? 'Salva modifiche' : 'Salva ' + hourLabel(e.oi) + ' – ' + hourLabel(e.of)) + '</button>' +
        (e.id ? plDupHtml(e) + '<button class="btn-danger-soft" onclick="App.plDeleteTurno()">Elimina turno</button>' : '') + close;
    }

    if (type === 'pl_drop') {
      var x = state.plDrop, dc = plColor(x.modello, x.oi);

        ruoloHtml +
        '<div class="field"><div class="field-label">Ore settimanali da contratto (facoltativo)</div><input inputmode="decimal" value="' + esc(p.ore) + '" oninput="App.plPersonaField(\'ore\', this.value)" placeholder="Es. 40"/></div>' +
        '<div class="field"><div class="field-label">Telefono (facoltativo)</div><input type="tel" value="' + esc(p.tel) + '" oninput="App.plPersonaField(\'tel\', this.value)"/></div>' +
        (p.tipo === 'fisso' ? '<div class="field"><div class="field-label">Giorni di ferie all\'anno (vuoto = valore base)</div><input inputmode="decimal" value="' + esc(p.gf) + '" oninput="App.plPersonaField(\'gf\', this.value)" placeholder="Es. 26"/></div>' +
          '<div class="field"><div class="field-label">Ore di permesso all\'anno (facoltativo)</div><input inputmode="decimal" value="' + esc(p.op) + '" oninput="App.plPersonaField(\'op\', this.value)"/></div>' : '') +
        (p.tel && !isNew ? '<a href="tel:' + esc(p.tel) + '" class="pl-btn" style="display:inline-block;text-decoration:none;margin-bottom:12px;">📞 Chiama</a>' : '') +

        (!isNew ? '<button class="btn-danger-soft" onclick="App.plDeletePersona()">Rimuovi dallo staff</button>' : '') + close;
    }

    if (type === 'pl_modelli') {
      var mm = state.plModello, list = plModelli();
      var listHtml = list.length ? '<div class="pl-model-list">' + list.map(function(m, i){
        return modelBtn(m, i, false, null, '<button class="btn-close" style="background:rgba(255,255,255,0.7);color:inherit;" onclick="App.plDeleteModello(' + i + ')">&times;</button>');
      }).join('') + '</div>' : '<div class="empty-hint" style="padding:10px 0;">Nessun turno modello.</div>';
      var colors = PL_COLORI_KEYS.map(function(k){
        var c = PL_COLORI[k];
        return '<button class="pl-color' + (mm.colore === k ? ' pl-color-active' : '') + '" style="background:' + c.bg + ';box-shadow:inset 0 0 0 1px ' + c.bd + ';" title="' + k + '" onclick="App.plModelloSet(\'colore\',\'' + k + '\')"></button>';

        '<div class="pl-sub">I turni che usi più spesso: nel pianificatore li inserisci con un tocco.</div>' + listHtml +

        '<div class="field-label">Dalle</div>' + plHourChips(mm.oi, HOUR_START, HOUR_END - 1, 'plModelloSet', 'oi') +
        '<div class="field-label">Fino alle</div>' + plHourChips(mm.of, HOUR_START + 1, HOUR_END, 'plModelloSet', 'of') +

    return '';

  // ---------- Ferie e permessi ----------
  var MESI_LUNGHI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  function siNo(v){ var s = String(v||'').trim().toLowerCase(); return s === 'si' || s === 'sì' || s === 'true'; }
  function numIt(v){ var n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? null : n; }
  function impost(chiave, def){
    var r = (state.cache.Impostazioni || []).find(function(x){ return String(val(x,'chiave')||'').trim().toLowerCase() === chiave.toLowerCase(); });
    var v = r ? String(val(r,'valore')||'').trim() : '';
    return v !== '' ? v : def;
  }
  function asLimite(){ return parseInt(impost('Max assenti stesso giorno', '2'), 10) || 2; }
  function asTipi(){
    return (state.cache.Tipi_Assenza || []).filter(function(t){ return String(val(t,'nome')||'').trim(); }).map(function(t){
      return { id: t[findKey(t,'ID')], nome: String(val(t,'nome')).trim(), colore: String(val(t,'colore')||'').trim().toLowerCase(),
        aOre: siNo(val(t,'a ore')), scalaFerie: siNo(val(t,'scala ferie')), scalaPermessi: siNo(val(t,'scala permessi')), approvazione: siNo(val(t,'approvazione')) };
    });
  }
  function asTipo(nome){
    var k = String(nome||'').trim().toLowerCase();
    return asTipi().find(function(t){ return t.nome.toLowerCase() === k; }) ||
      { nome: nome || 'Assenza', colore: 'giallo', aOre: false, scalaFerie: false, scalaPermessi: false, approvazione: true };
  }
  function asColore(nome){ return PL_COLORI[asTipo(nome).colore] || PL_COLORI.giallo; }
  function asEmoji(nome){
    var k = String(nome||'').toLowerCase();
    if (k.indexOf('ferie') !== -1) return '🌴';
    if (k.indexOf('malatt') !== -1) return '🤒';
    if (k.indexOf('permess') !== -1) return '⏱️';
    if (k.indexOf('riposo') !== -1) return '😴';
    return '📅';
  }
  var asMemo = { src: null, rows: [] };
  function asRows(){
    var src = state.cache.Assenze;
    if (asMemo.src === src) return asMemo.rows;
    asMemo.src = src;
    asMemo.rows = (src || []).map(function(r){
      return { id: r[findKey(r,'ID')], nome: String(val(r,'dipendente')||'').trim(), tipo: String(val(r,'tipo')||'').trim(),
        dal: String(val(r,'dal')||'').slice(0,10), al: String(val(r,'al')||val(r,'dal')||'').slice(0,10),
        dalle: String(val(r,'dalle')||''), alle: String(val(r,'alle')||''),
        giorni: numIt(val(r,'giorni')) || 0, ore: numIt(val(r,'ore')) || 0,
        stato: String(val(r,'stato')||'').trim().toLowerCase(), nota: String(val(r,'nota')||''),
        motivo: String(val(r,'motivo rifiuto')||''), gestito: String(val(r,'gestito da')||'') };
    }).filter(function(a){ return a.nome && a.dal; });
    return asMemo.rows;
  }
  function asOn(nome, ds, includePending){
    var k = String(nome).toLowerCase();
    return asRows().filter(function(a){
      return a.nome.toLowerCase() === k && a.dal <= ds && a.al >= ds && (a.stato === 'approvata' || (includePending && a.stato === 'in attesa'));
    });
  }

  // Festivi nazionali (calcolati, Pasqua compresa) + festivi aggiunti dalla titolare
  function pasqua(y){
    var a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
      month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return new Date(y, month-1, day);
  }
  var festiviCache = {};
  function festiviNazionali(y){
    if (festiviCache[y]) return festiviCache[y];
    var f = {};
    function add(m, d, n){ f[y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0')] = n; }
    add(1,1,'Capodanno'); add(1,6,'Epifania'); add(4,25,'Festa della Liberazione'); add(5,1,'Festa del lavoro');
    add(6,2,'Festa della Repubblica'); add(8,15,'Ferragosto'); add(11,1,'Ognissanti'); add(12,8,'Immacolata');
    add(12,25,'Natale'); add(12,26,'Santo Stefano');
    var p = pasqua(y);
    f[fmtDate(p)] = 'Pasqua'; f[fmtDate(addDays(p,1))] = 'Lunedì dell\'Angelo';
    festiviCache[y] = f;
    return f;
  }
  function festivoNome(ds){
    var n = festiviNazionali(parseInt(ds.slice(0,4),10))[ds];
    if (n) return n;
    var c = (state.cache.Festivi || []).find(function(r){ return String(val(r,'data')).slice(0,10) === ds; });
    return c ? (String(val(c,'nome')||'').trim() || 'Festivo') : '';
  }
  function asContaDomeniche(){ return siNo(impost('Conta domeniche', 'no')); }
  function asContaGiorni(dal, al){
    if (!dal || !al || al < dal) return 0;
    var dom = asContaDomeniche(), n = 0, cur = parseDate(dal), end = fmtDate(parseDate(al)), guard = 0;
    while (fmtDate(cur) <= end && guard++ < 400) {
      if (!(cur.getDay() === 0 && !dom) && !festivoNome(fmtDate(cur))) n++;
      cur = addDays(cur, 1);
    }
    return n;
  }
  function asRegolaTxt(){ return asContaDomeniche() ? 'esclusi i festivi' : 'escluse domeniche e festivi'; }

  // Saldi
  function asUtente(nome){
    var k = String(nome).toLowerCase();
    return (state.cache.Utenti || []).find(function(u){ return String(val(u,'nome')||'').trim().toLowerCase() === k; });
  }
  function asSaldo(nome, anno){
    var u = asUtente(nome);
    var g = u ? numIt(val(u,'giorni ferie anno')) : null;
    if (g == null) g = numIt(impost('Giorni ferie base', '26')) || 0;
    var o = u ? numIt(val(u,'ore permesso anno')) : null;
    var s = { spettanti: g, approvate: 0, attesa: 0, oreSpettanti: o || 0, oreUsate: 0, oreAttesa: 0 };
    var k = String(nome).toLowerCase();
    asRows().forEach(function(a){
      if (a.nome.toLowerCase() !== k || a.dal.slice(0,4) !== String(anno)) return;
      var t = asTipo(a.tipo);
      if (t.scalaFerie) { if (a.stato === 'approvata') s.approvate += a.giorni; else if (a.stato === 'in attesa') s.attesa += a.giorni; }
      if (t.scalaPermessi) { if (a.stato === 'approvata') s.oreUsate += a.ore; else if (a.stato === 'in attesa') s.oreAttesa += a.ore; }
    });
    s.residue = s.spettanti - s.approvate;
    return s;
  }

  // Sovrapposizioni con altre persone
  function asOverlap(nome, dal, al, exceptId){
    var k = String(nome).toLowerCase();
    return asRows().filter(function(x){
      return String(x.id) !== String(exceptId) && x.nome.toLowerCase() !== k &&
        (x.stato === 'approvata' || x.stato === 'in attesa') && x.dal <= al && x.al >= dal;
    });
  }
  function asMaxAssenti(nome, dal, al, exceptId){
    var others = asOverlap(nome, dal, al, exceptId), max = 0, cur = parseDate(dal), end = fmtDate(parseDate(al)), g = 0;
    while (fmtDate(cur) <= end && g++ < 400) {
      var ds = fmtDate(cur), names = [];
      others.forEach(function(x){ if (x.dal <= ds && x.al >= ds && names.indexOf(x.nome.toLowerCase()) === -1) names.push(x.nome.toLowerCase()); });
      if (names.length + 1 > max) max = names.length + 1;
      cur = addDays(cur, 1);
    }
    return max;
  }
  function asOverlapWarn(nome, dal, al, exceptId){
    var others = asOverlap(nome, dal, al, exceptId);
    if (!others.length) return '';
    var max = asMaxAssenti(nome, dal, al, exceptId);
    return '<div class="as-warn">' + (max >= asLimite() ? '⚠️ <b>' + max + ' persone assenti</b> nello stesso giorno. ' : '') +
      'Nello stesso periodo: ' + others.map(function(x){
        return esc(x.nome) + ' (' + esc(x.tipo) + ', ' + asPeriodo(x) + (x.stato === 'in attesa' ? ', in attesa' : '') + ')';
      }).join('; ') + '</div>';
  }

  function asPeriodo(a){
    var d1 = parseDate(a.dal), d2 = parseDate(a.al);
    function f(d){ return d.getDate() + ' ' + MESI_SHORT[d.getMonth()]; }
    var s = a.dal === a.al ? GIORNI_LABELS[(d1.getDay()+6)%7] + ' ' + f(d1) + ' ' + d1.getFullYear() : f(d1) + ' – ' + f(d2) + ' ' + d2.getFullYear();
    if (a.dalle && a.alle) s += ' · ' + a.dalle + '–' + a.alle;
    return s;
  }
  function asQuanto(a){
    if (asTipo(a.tipo).aOre || a.dalle) return fmtOre(a.ore) + ' h';
    return fmtOre(a.giorni) + (a.giorni === 1 ? ' giorno' : ' giorni');
  }
  function asStatoHtml(s){
    var m = { 'in attesa': ['attesa','In attesa'], 'approvata': ['approvata','Approvata'], 'rifiutata': ['rifiutata','Rifiutata'] }[s] || ['attesa', s || '—'];
    return '<span class="as-stato as-stato-' + m[0] + '">' + m[1] + '</span>';
  }
  function asItemHtml(a, ctx){
    var col = asColore(a.tipo);
    var html = '<div class="as-item" style="border-left-color:' + col.bd + ';"><div class="as-item-head"><div>' +
      '<div class="as-item-title">' + (ctx === 'mie' ? '' : esc(a.nome) + ' · ') + asEmoji(a.tipo) + ' ' + esc(a.tipo) + '</div>' +
      '<div class="as-item-sub">' + asPeriodo(a) + ' · ' + asQuanto(a) + '</div></div>' + asStatoHtml(a.stato) + '</div>';
    if (a.nota) html += '<div class="as-item-sub">📝 ' + esc(a.nota) + '</div>';
    if (a.stato === 'rifiutata' && a.motivo) html += '<div class="as-item-sub">Motivo: ' + esc(a.motivo) + '</div>';
    if (a.gestito && a.stato !== 'in attesa' && ctx !== 'mie') html += '<div class="as-item-sub">Gestita da ' + esc(a.gestito) + '</div>';
    if (ctx === 'approva') {
      html += asOverlapWarn(a.nome, a.dal, a.al, a.id) +
        '<div class="as-btn-row"><button class="as-ok" onclick="App.asDecidi(\'' + esc(a.id) + '\',\'approvata\')">Approva</button>' +
        '<button class="as-no" onclick="App.asDecidi(\'' + esc(a.id) + '\',\'rifiutata\')">Rifiuta</button></div>';
    } else if (ctx === 'mie' && a.stato === 'in attesa') {
      html += '<button class="btn-resolve" onclick="App.asAnnulla(\'' + esc(a.id) + '\')">Annulla richiesta</button>';
    } else if (ctx === 'tutte' && isTitolare(state.user)) {
      html += '<button class="btn-resolve" onclick="App.asAnnulla(\'' + esc(a.id) + '\')">Elimina</button>';
    }
    return html + '</div>';
  }
  function asLegend(){
    return '<div class="as-legend">' + asTipi().map(function(t){
      var c = PL_COLORI[t.colore] || PL_COLORI.giallo;
      return '<span><i style="background:' + c.bg + ';border-color:' + c.bd + ';"></i>' + esc(t.nome) + '</span>';
    }).join('') + '<span><i style="background:transparent;border:1px dashed #999;"></i>in attesa</span>' +
      '<span style="color:var(--danger);font-weight:700;">rosso = festivo</span></div>';
  }
  function asPeople(){
    var ORD = { fisso:0, extra:1, chiamata:2 };
    var ppl = (state.cache.Utenti || []).filter(function(u){ return String(val(u,'nome')||'').trim(); })
      .map(function(u){ return { nome: String(val(u,'nome')).trim(), tipo: tipoOf(u) }; });
    var known = ppl.map(function(p){ return p.nome.toLowerCase(); });
    asRows().forEach(function(a){
      if (known.indexOf(a.nome.toLowerCase()) === -1) { known.push(a.nome.toLowerCase()); ppl.push({ nome: a.nome, tipo: 'extra' }); }
    });
    return ppl.sort(function(a,b){ return (ORD[a.tipo] - ORD[b.tipo]) || a.nome.localeCompare(b.nome); });
  }
  function asNav(label, fn){
    return '<div class="week-nav nav-center"><button class="week-nav-btn" onclick="App.' + fn + '(-1)">‹</button>' +
      '<div class="week-nav-label">' + label + '</div><button class="week-nav-btn" onclick="App.' + fn + '(1)">›</button></div>';
  }

  // -- Schermata principale --
  function renderAssenze(){
    if (!state.asYear) state.asYear = new Date().getFullYear();
    if (!state.asMonth) state.asMonth = todayStr().slice(0,7);
    ['Assenze','Tipi_Assenza','Impostazioni','Festivi','Utenti'].forEach(function(s){ ensureLoaded(s); });
    var c = state.cache, tit = isTitolare(state.user), man = isManager(state.user);
    var pend = c.Assenze ? asRows().filter(function(a){ return a.stato === 'in attesa'; }).length : 0;
    var tabs = [{ k:'mie', l:'Le mie' }];
    if (tit) tabs.push({ k:'approva', l:'Da approvare', n: pend });
    if (man) { tabs.push({ k:'team', l:'Team' }); tabs.push({ k:'saldi', l:'Saldi' }); }
    if (tit) tabs.push({ k:'impost', l:'Impostazioni' });
    if (!tabs.some(function(t){ return t.k === state.asTab; })) state.asTab = 'mie';
    var tabsHtml = tabs.length > 1 ? '<div class="as-tabs">' + tabs.map(function(t){
      return '<button class="chip ' + (state.asTab === t.k ? 'chip-active' : '') + '" onclick="App.asSetTab(\'' + t.k + '\')">' + t.l +
        (t.n ? '<span class="as-count">' + t.n + '</span>' : '') + '</button>';
    }).join('') + '</div>' : '';
    var body;
    if (!c.Assenze || !c.Tipi_Assenza || !c.Impostazioni || !c.Festivi || !c.Utenti) body = '<div class="center-loading">Carico ferie e permessi…</div>';
    else body = ({ mie: asRenderMie, approva: asRenderApprova, team: asRenderTeam, saldi: asRenderSaldi, impost: asRenderImpost })[state.asTab]();
    var addBtn = '<button class="btn-round" onclick="App.asOpenRichiesta(-1,\'\',false)">+</button>';
    return '<div>' + renderTopBarWithAction('Ferie e permessi', addBtn) + tabsHtml + body + '</div>';
  }

  function asRenderMie(){
    if (!state.asCalMonth) state.asCalMonth = todayStr().slice(0,7);
    var me = state.user.nome, y = parseInt(state.asCalMonth.slice(0,4), 10), s = asSaldo(me, y);
    var saldo = '<div class="as-card"><div class="as-title">Le tue ferie ' + y + '</div><div class="as-saldo">' +
      '<div><b>' + fmtOre(s.spettanti) + '</b><span>spettanti</span></div>' +
      '<div><b>' + fmtOre(s.approvate) + '</b><span>approvate</span></div>' +
      '<div><b>' + fmtOre(s.attesa) + '</b><span>in attesa</span></div>' +
      '<div><b style="color:' + (s.residue < 0 ? 'var(--danger)' : 'oklch(0.5 0.13 150)') + ';">' + fmtOre(s.residue) + '</b><span>residue</span></div></div>' +
      (s.oreSpettanti || s.oreUsate ? '<div class="as-item-sub" style="margin-top:10px;">⏱️ Permessi: <b>' + fmtOre(s.oreUsate) + ' h</b> usate' +
        (s.oreSpettanti ? ' su ' + fmtOre(s.oreSpettanti) + ' · residue <b>' + fmtOre(s.oreSpettanti - s.oreUsate) + ' h</b>' : '') +
        (s.oreAttesa ? ' · ' + fmtOre(s.oreAttesa) + ' h in attesa' : '') + '</div>' : '') +
      '<div class="as-item-sub" style="margin-top:6px;">Giorni contati ' + asRegolaTxt() + '.</div>' +
      '<button class="btn-submit" style="margin-top:12px;" onclick="App.asOpenRichiesta(-1,\'\',false)">+ Richiedi ferie o permesso</button></div>';
    var cm = state.asCalMonth.split('-');
    var cal = '<div class="as-card">' + asNav(MESI_LUNGHI[parseInt(cm[1],10)-1] + ' ' + cm[0], 'asShiftCalMonth') +
      asMonthCalendar(me, state.asCalMonth) + asLegend() + '</div>';
    var mine = asRows().filter(function(a){ return a.nome.toLowerCase() === me.toLowerCase() && a.dal.slice(0,4) === String(y); })
      .sort(function(a,b){ return b.dal.localeCompare(a.dal); });
    var list = mine.length ? mine.map(function(a){ return asItemHtml(a, 'mie'); }).join('') : '<div class="empty-hint">Nessuna richiesta nel ' + y + '.</div>';
    return cal + saldo + '<div class="section-label">Le tue richieste ' + y + '</div>' + list;
  }

  // Calendario di un mese, grande: tocca un giorno per chiedere o vedere un'assenza
  function asMonthCalendar(nome, ym){
    var p = ym.split('-'), y = +p[0], m = +p[1] - 1, t = todayStr(), k = String(nome).toLowerCase();
    var mine = asRows().filter(function(a){ return a.nome.toLowerCase() === k && (a.stato === 'approvata' || a.stato === 'in attesa'); });
    var lead = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m+1, 0).getDate();
    var cells = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(function(x){ return '<div class="asm-dh">' + x + '</div>'; }).join('');
    for (var i = 0; i < lead; i++) cells += '<div class="asm-d asm-out"></div>';
    var festList = [];
    for (var d = 1; d <= dim; d++) {
      var dt = new Date(y, m, d), ds = fmtDate(dt), fest = festivoNome(ds);
      if (fest) festList.push(d + ' ' + MESI_SHORT[m] + ' · ' + fest);
      var a = mine.find(function(x){ return x.dal <= ds && x.al >= ds; });
      var cls = 'asm-d' + (fest ? ' asm-fest' : '') + (dt.getDay() === 0 && !fest ? ' asm-sun' : '') + (ds === t ? ' asm-today' : '');
      var style = '', label = '';
      if (a) {
        var col = asColore(a.tipo);
        style = ' style="background:' + col.bg + ';border-color:' + col.bd + ';color:' + col.fg + ';"';
        if (a.stato === 'in attesa') cls += ' asm-pend';
        label = '<div class="asm-e">' + asEmoji(a.tipo) + '</div><div class="asm-t">' + esc(a.tipo) + '</div>';
      }
      var click = a ? 'App.asApriDettaglio(\'' + esc(a.id) + '\')' : 'App.asOpenRichiesta(-1,\'' + ds + '\',false)';
      cells += '<button class="' + cls + '"' + style + ' onclick="' + click + '"><div class="asm-n">' + d + '</div>' + label + '</button>';
    }
    return '<div class="asm-grid">' + cells + '</div>' +
      (festList.length ? '<div class="asm-fest-list">🔴 Festivi: ' + festList.map(esc).join(' · ') + '</div>' : '') +
      '<div class="turni-hint">Tocca un giorno libero per fare una richiesta</div>';
  }

  function asYearCalendar(nome, y){
    var t = todayStr(), k = String(nome).toLowerCase();
    var mine = asRows().filter(function(a){ return a.nome.toLowerCase() === k && (a.stato === 'approvata' || a.stato === 'in attesa'); });
    var out = '<div class="as-year">';
    for (var m = 0; m < 12; m++) {
      var lead = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m+1, 0).getDate();
      var cells = ['L','M','M','G','V','S','D'].map(function(x){ return '<div class="as-dh">' + x + '</div>'; }).join('');
      for (var i = 0; i < lead; i++) cells += '<div class="as-d as-d-out">.</div>';
      for (var d = 1; d <= dim; d++) {
        var dt = new Date(y, m, d), ds = fmtDate(dt), fest = festivoNome(ds);
        var a = mine.find(function(x){ return x.dal <= ds && x.al >= ds; });
        var cls = 'as-d' + (fest ? ' as-d-fest' : '') + (dt.getDay() === 0 && !fest ? ' as-d-sun' : '') + (ds === t ? ' as-d-today' : '');
        var style = '';
        if (a) {
          var col = asColore(a.tipo);
          style = ' style="background:' + col.bg + ';border-color:' + col.bd + ';color:' + col.fg + ';"';
          if (a.stato === 'in attesa') cls += ' as-d-pend';
        }
        var title = [fest, a ? a.tipo + (a.stato === 'in attesa' ? ' (in attesa)' : '') : ''].filter(Boolean).join(' · ');
        cells += '<div class="' + cls + '"' + style + (title ? ' title="' + esc(title) + '"' : '') + '>' + d + '</div>';
      }
      out += '<div><div class="as-month-name">' + MESI_LUNGHI[m] + '</div><div class="as-mgrid">' + cells + '</div></div>';
    }
    return out + '</div>';
  }

  function asRenderApprova(){
    var pend = asRows().filter(function(a){ return a.stato === 'in attesa'; }).sort(function(a,b){ return a.dal.localeCompare(b.dal); });
    var recenti = asRows().filter(function(a){ return a.stato !== 'in attesa'; }).sort(function(a,b){ return b.dal.localeCompare(a.dal); }).slice(0, 15);
    return '<button class="btn-submit" style="margin-top:14px;" onclick="App.asOpenRichiesta(-1,\'\',true)">+ Registra un\'assenza per un dipendente</button>' +
      '<div class="section-label">In attesa</div>' +
      (pend.length ? pend.map(function(a){ return asItemHtml(a, 'approva'); }).join('') : '<div class="empty-hint">Nessuna richiesta da approvare 🎉</div>') +
      (recenti.length ? '<div class="section-label">Ultime gestite</div>' + recenti.map(function(a){ return asItemHtml(a, 'tutte'); }).join('') : '');
  }

  function asRenderTeam(){
    var p = state.asMonth.split('-'), y = +p[0], m = +p[1] - 1, dim = new Date(y, m+1, 0).getDate();
    var t = todayStr(), tit = isTitolare(state.user), lim = asLimite(), GL = ['D','L','M','M','G','V','S'];
    var days = [];
    for (var d = 1; d <= dim; d++) days.push(fmtDate(new Date(y, m, d)));
    var people = asPeople();
    state.asPeople = people;
    var head = '<tr><th class="as-tname">Persone</th>' + days.map(function(ds){
      var dt = parseDate(ds), fest = festivoNome(ds), off = dt.getDay() === 0 || fest;
      return '<th class="' + (off ? 'as-off' : '') + '"' + (ds === t ? ' data-today="1"' : '') + (fest ? ' title="' + esc(fest) + '"' : '') + '>' + GL[dt.getDay()] +
        '<b style="' + (ds === t ? 'color:var(--accent);' : fest ? 'color:var(--danger);' : '') + '">' + dt.getDate() + '</b></th>';
    }).join('') + '</tr>';
    var counts = days.map(function(){ return 0; });
    var rows = people.map(function(pp, pi){
      return '<tr><td class="as-tname" title="' + esc(pp.nome) + '">' + esc(pp.nome) + '</td>' + days.map(function(ds, di){
        var dt = parseDate(ds), off = dt.getDay() === 0 || festivoNome(ds);
        var a = asOn(pp.nome, ds, true)[0], inner = '';
        if (a) {
          counts[di]++;
          var col = asColore(a.tipo), pendente = a.stato === 'in attesa';
          inner = '<span title="' + esc(pp.nome + ' · ' + a.tipo + (pendente ? ' (in attesa)' : '')) + '" style="background:' + (pendente ? 'transparent' : col.bg) +
            ';border-color:' + col.bd + ';' + (pendente ? 'border-style:dashed;' : '') + '"></span>';
        }
        var click = tit ? ' onclick="App.asCellClick(' + pi + ',\'' + ds + '\')"' : '';
        return '<td class="as-tc' + (off ? ' as-off' : '') + '"' + click + '>' + inner + '</td>';
      }).join('') + '</tr>';
    }).join('');
    var foot = '<tr class="as-tcount"><td class="as-tname">Assenti</td>' + counts.map(function(n){
      return '<td class="' + (n >= lim ? 'as-over' : '') + '">' + (n || '') + '</td>';
    }).join('') + '</tr>';
    var over = counts.filter(function(n){ return n >= lim; }).length;
    return asNav(MESI_LUNGHI[m] + ' ' + y, 'asShiftMonth') +
      '<div class="pl-actions"><button class="pl-btn" onclick="App.asEsporta()">⬇️ Esporta il mese (Excel)</button>' +
      (tit ? '<button class="pl-btn" onclick="App.asOpenRichiesta(-1,\'\',true)">+ Registra assenza</button>' : '') + '</div>' +
      (over ? '<div class="as-warn">⚠️ In ' + over + ' giorn' + (over === 1 ? 'o' : 'i') + ' di questo mese ci sono ' + lim + ' o più persone assenti (in rosso in fondo).</div>' : '') +
      '<div class="as-team-wrap"><table class="as-team"><thead>' + head + '</thead><tbody>' + rows + foot + '</tbody></table></div>' +
      asLegend() + (tit ? '<div class="turni-hint">Tocca una casella per registrare un\'assenza o gestire quella esistente</div>' : '');
  }

        '<td>' + fmtOre(s.spettanti) + '</td><td>' + fmtOre(s.approvate) + '</td><td>' + (s.attesa ? fmtOre(s.attesa) : '–') + '</td>' +
        '<td style="font-weight:800;color:' + (s.residue < 0 ? 'var(--danger)' : 'inherit') + ';">' + fmtOre(s.residue) + '</td>' +

      '<tbody>' + (rows || '<tr><td colspan="6">Nessun dipendente fisso.</td></tr>') + '</tbody></table>' +
      '<div class="as-item-sub" style="margin-top:10px;">Giorni di ferie, ' + asRegolaTxt() + '.' + (tit ? ' Tocca una persona per cambiare i giorni spettanti o le ore di permesso.' : '') + '</div></div>';
  }

    var nf = state.asNewFest || (state.asNewFest = { data: '', nome: '' });

      var c = PL_COLORI[t.colore] || PL_COLORI.giallo;

      '<div class="field"><div class="field-label">Avvisa quando sono assenti nello stesso giorno almeno</div><input inputmode="numeric" value="' + esc(rg.max) + '" oninput="App.asRegolaField(\'max\', this.value)"/></div>' +
      '<label class="as-toggle"><input type="checkbox"' + (rg.dom ? ' checked' : '') + ' onchange="App.asRegolaField(\'dom\', this.checked)"/>Conta anche le domeniche come giorni di ferie</label>' +

  // -- Azioni --
  function asSetTab(k){ state.asTab = k; render(); }
  function asShiftYear(d){ state.asYear += d; render(); }
  function asShiftCalMonth(d){
    var p = state.asCalMonth.split('-'), dt = new Date(+p[0], +p[1] - 1 + d, 1);
    state.asCalMonth = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
    render();
  }
  function asApriDettaglio(id){ state.asDett = id; state.activeModal = 'as_dettaglio'; render(); }
  function asShiftMonth(d){
    var p = state.asMonth.split('-'), dt = new Date(+p[0], +p[1] - 1 + d, 1);
    state.asMonth = dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0');
    render();
  }
  function asOpenRichiesta(pi, ds, perAltri){
    var tipi = asTipi(), d = ds || todayStr();
    var p = perAltri && pi >= 0 && state.asPeople ? state.asPeople[pi] : null;
    state.asForm = { nome: p ? p.nome : (perAltri ? '' : state.user.nome), tipo: tipi[0] ? tipi[0].nome : 'Ferie',
      dal: d, al: d, dalle: 9, alle: 11, nota: '', perAltri: !!perAltri && isTitolare(state.user) };
    state.activeModal = 'as_richiesta';
    render();
  }
  function asFormField(k, v, rerender){
    var f = state.asForm;
    if (!f) return;
    f[k] = v;
    if (k === 'dal' && f.al < f.dal) f.al = f.dal;
    if (rerender) render();
  }
  function asFormTipo(i){ var t = asTipi()[i]; if (t && state.asForm) { state.asForm.tipo = t.nome; render(); } }
  function asFormPerson(i){ var p = state.asFormPeople && state.asFormPeople[i]; if (p && state.asForm) { state.asForm.nome = p.nome; render(); } }
  function asFormOra(k, h){
    var f = state.asForm;
    if (!f) return;
    f[k] = h;
    if (f.alle <= f.dalle) { if (k === 'dalle') f.alle = Math.min(HOUR_END, f.dalle + 1); else f.dalle = Math.max(HOUR_START, f.alle - 1); }
    render();
  }
  function asAfter(sheet, msg){
    return function(res){
      state.busy = false;
      if (!res || res.error) { if (!(res && res.auth)) alert((res && res.error) || 'Errore'); render(); return; }
      if (state.activeModal && state.activeModal.indexOf('as_') === 0) state.activeModal = null;
      reload(sheet);
      render();
      if (msg) setTimeout(function(){ alert(typeof msg === 'function' ? msg(res) : msg); }, 250);
    };
  }
  function asInvia(){
    var f = state.asForm;
    if (!f || state.busy) return;
    if (!f.nome) { alert('Scegli la persona'); return; }
    var tipo = asTipo(f.tipo), data = { Dipendente: f.nome, Tipo: f.tipo, Nota: (f.nota || '').trim() };
    if (tipo.aOre) {
      if (!f.dal) { alert('Scegli il giorno'); return; }
      data.Dal = f.dal; data.Al = f.dal; data.Dalle = hourLabel(f.dalle); data.Alle = hourLabel(f.alle); data.Ore = String(f.alle - f.dalle);
    } else {
      if (!f.dal || !f.al || f.al < f.dal) { alert('Controlla le date: la fine deve essere uguale o dopo l\'inizio.'); return; }
      var g = asContaGiorni(f.dal, f.al);
      if (!g && !confirm('Nel periodo scelto ci sono solo domeniche o festivi (0 giorni conteggiati). Inviare comunque?')) return;
      data.Dal = f.dal; data.Al = f.al; data.Giorni = String(g);
    }
    state.busy = true;
    render();
    apiPost({ sheet: 'Assenze', data: data }).then(asAfter('Assenze', function(res){
      if (f.perAltri) return 'Assenza registrata ✅';
      return res.stato === 'in attesa' ? 'Richiesta inviata alla titolare ✅' : 'Registrata e comunicata alla titolare ✅';
    }));
  }
  function asDecidi(id, stato){
    if (state.busy) return;
    var data = { Stato: stato };
    if (stato === 'rifiutata') {
      var motivo = prompt('Motivo del rifiuto (lo vedrà il dipendente):');
      if (motivo === null) return;
      if (!motivo.trim()) { alert('Scrivi il motivo del rifiuto.'); return; }
      data['Motivo rifiuto'] = motivo.trim();
    }
    state.busy = true;
    render();
    apiPost({ sheet: 'Assenze', action: 'update', id: id, data: data }).then(asAfter('Assenze'));
  }
  function asAnnulla(id){
    var a = asRows().find(function(x){ return String(x.id) === String(id); });
    if (!a || state.busy) return;
    if (!confirm((a.stato === 'in attesa' ? 'Annullare la richiesta' : 'Eliminare l\'assenza') + ' "' + a.tipo + ' · ' + asPeriodo(a) + '"?')) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Assenze', action: 'delete', id: id }).then(asAfter('Assenze'));
  }
  function asCellClick(pi, ds){
    var p = state.asPeople && state.asPeople[pi];
    if (!p) return;
    var a = asOn(p.nome, ds, true)[0];
    if (a) { state.asDett = a.id; state.activeModal = 'as_dettaglio'; render(); }
    else asOpenRichiesta(pi, ds, true);
  }
  function asEditSaldo(i){
    var p = state.asSaldiPeople && state.asSaldiPeople[i];
    if (!p || state.busy) return;
    var u = asUtente(p.nome);
    var g = prompt('Giorni di ferie all\'anno per ' + p.nome + ' (vuoto = valore base ' + impost('Giorni ferie base','26') + '):', u ? String(val(u,'giorni ferie anno')||'') : '');
    if (g === null) return;
    var o = prompt('Ore di permesso all\'anno per ' + p.nome + ' (vuoto = non conteggiate):', u ? String(val(u,'ore permesso anno')||'') : '');
    if (o === null) return;
    if ((g.trim() && numIt(g) == null) || (o.trim() && numIt(o) == null)) { alert('Scrivi solo numeri.'); return; }
    state.busy = true;
    render();
    apiPost({ sheet: 'Utenti', action: 'update', matchField: 'Nome', matchValue: p.nome, data: { 'Giorni ferie anno': g.trim(), 'Ore permesso anno': o.trim() } }).then(asAfter('Utenti'));
  }
  function asTipoField(k, v){ if (state.asNewTipo) state.asNewTipo[k] = v; }
  function asTipoColore(k){ if (state.asNewTipo) { state.asNewTipo.colore = k; render(); } }
  function asAddTipo(){
    var t = state.asNewTipo;
    if (!t || state.busy) return;
    var nome = String(t.nome || '').trim();
    if (!nome) { alert('Scrivi il nome del tipo di assenza'); return; }
    if (asTipi().some(function(x){ return x.nome.toLowerCase() === nome.toLowerCase(); })) { alert('Esiste già un tipo con questo nome.'); return; }
    state.busy = true;
    render();
    apiPost({ sheet: 'Tipi_Assenza', data: { Nome: nome, Colore: t.colore, 'A ore': t.aOre ? 'si' : '', 'Scala ferie': t.scalaFerie ? 'si' : '',

  function asEsporta(){
    var p = state.asMonth.split('-'), from = state.asMonth + '-01', to = fmtDate(new Date(+p[0], +p[1], 0));
    var rows = asRows().filter(function(a){ return a.stato === 'approvata' && a.dal <= to && a.al >= from; })
      .sort(function(a,b){ return a.nome.localeCompare(b.nome) || a.dal.localeCompare(b.dal); });
    if (!rows.length) { alert('Nessuna assenza approvata in questo mese.'); return; }
    function cell(x){ return '"' + String(x == null ? '' : x).replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"'; }
    var lines = [['Dipendente','Tipo','Dal','Al','Dalle','Alle','Giorni','Ore','Nota','Approvata da'].map(cell).join(';')];
    rows.forEach(function(a){
      lines.push([a.nome, a.tipo, a.dal, a.al, a.dalle, a.alle, a.giorni ? fmtOre(a.giorni) : '', a.ore ? fmtOre(a.ore) : '', a.nota, a.gestito].map(cell).join(';'));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'assenze-' + state.asMonth + '.csv';
    document.body.appendChild(link);
    link.click();
    setTimeout(function(){ URL.revokeObjectURL(link.href); link.remove(); }, 1000);

        '<div class="as-item-sub" style="margin-bottom:12px;">' + (f.al < f.dal ? '⚠️ La data di fine è prima di quella di inizio.' :
          'Giorni conteggiati: <b>' + g + '</b> (' + asRegolaTxt() + ')') + '</div>';

  // ---------- Richieste di turno (dipendente → titolare) ----------
  var rtMemo = { src: null, rows: [] };
  function rtRows(){
    var src = state.cache.Richieste_Turno;
    if (rtMemo.src === src) return rtMemo.rows;
    rtMemo.src = src;
    rtMemo.rows = (src || []).map(function(r){
      return { id: r[findKey(r,'ID')], nome: String(val(r,'dipendente')||'').trim(), data: String(val(r,'data')||'').slice(0,10),
        modello: String(val(r,'modello')||'').trim(), dalle: String(val(r,'dalle')||''), alle: String(val(r,'alle')||''),
        riposo: siNo(val(r,'riposo')), motivo: String(val(r,'motivo')||''), stato: String(val(r,'stato')||'').trim().toLowerCase(),
        risposta: String(val(r,'risposta')||''), gestito: String(val(r,'gestito da')||'') };
    }).filter(function(r){ return r.nome && r.data; });
    return rtMemo.rows;
  }
  function rtPending(){ return rtRows().filter(function(r){ return r.stato === 'in attesa'; }); }
  function rtCosa(r){ return r.riposo ? '😴 Giorno di riposo' : (r.modello ? r.modello + ' ' : 'Orario ') + r.dalle + '–' + r.alle; }
  function rtGiorno(ds){ var d = parseDate(ds); return GIORNI_LABELS[(d.getDay()+6)%7] + ' ' + d.getDate() + ' ' + MESI_SHORT[d.getMonth()]; }
  function rtItemHtml(r, ctx){
    var html = '<div class="as-item" style="border-left-color:var(--accent);"><div class="as-item-head"><div>' +
      '<div class="as-item-title">' + (ctx === 'mie' ? '' : esc(r.nome) + ' · ') + '📝 ' + rtGiorno(r.data) + '</div>' +
      '<div class="as-item-sub">' + esc(rtCosa(r)) + '</div></div>' + asStatoHtml(r.stato) + '</div>';
    if (r.motivo) html += '<div class="as-item-sub">💬 ' + esc(r.motivo) + '</div>';
    if (r.risposta) html += '<div class="as-item-sub">Risposta: ' + esc(r.risposta) + '</div>';
    if (ctx === 'approva') {
      html += '<div class="as-btn-row"><button class="as-ok" onclick="App.rtApprova(\'' + esc(r.id) + '\')">' + (r.riposo ? 'Approva' : 'Approva e inserisci') + '</button>' +
        '<button class="as-no" onclick="App.rtRifiuta(\'' + esc(r.id) + '\')">Rifiuta</button></div>';
    } else if (ctx === 'mie' && r.stato === 'in attesa') {
      html += '<button class="btn-resolve" onclick="App.rtAnnulla(\'' + esc(r.id) + '\')">Annulla richiesta</button>';
    } else if (ctx === 'tutte' && isTitolare(state.user)) {
      html += '<button class="btn-resolve" onclick="App.rtAnnulla(\'' + esc(r.id) + '\')">Elimina</button>';
    }
    return html + '</div>';
  }
  // Avviso nella griglia del pianificatore: "📝 chiede: Colazione 07–12"
  function rtBadge(nome, ds){
    if (!state.cache.Richieste_Turno) return '';
    var k = String(nome).toLowerCase();
    return rtRows().filter(function(r){ return r.nome.toLowerCase() === k && r.data === ds && (r.stato === 'in attesa' || r.stato === 'approvata'); })
      .map(function(r){
        var p = r.stato === 'in attesa';
        return '<button class="rt-badge' + (p ? '' : ' rt-badge-ok') + '" title="' + esc(rtCosa(r) + (r.motivo ? ' — ' + r.motivo : '')) + '" onclick="App.rtApri(\'' + esc(r.id) + '\')">' +
          (p ? '📝 chiede: ' : '✅ richiesto: ') + esc(r.riposo ? 'riposo' : (r.modello || r.dalle + '–' + r.alle)) + '</button>';
      }).join('');

  // -- Sezione del dipendente nella schermata Turni --
  function renderMieRichiesteTurno(){
    if (isTitolare(state.user)) return '';
    ensureLoaded('Richieste_Turno');
    ensureLoaded('Turni_Modello');
    var head = '<div class="oreferie-title" style="margin-top:26px;">Le mie richieste di turno</div>' +

      '<button class="pl-btn pl-btn-primary" style="margin-top:10px;" onclick="App.rtOpen()">📝 Chiedi un turno alla titolare</button>';
