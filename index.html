<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Virtus Tennis - Staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f4fa">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(function(OneSignal) {
    OneSignal.init({
      appId: "71900c39-f127-4a4d-9635-d0aaefc73706",
      path: '/virtus-staff-app/',
      serviceWorkerParam: { scope: '/virtus-staff-app/' },
      serviceWorkerPath: 'OneSignalSDKWorker.js',
      // Messaggio che arriva appena un telefono attiva le notifiche
      welcomeNotification: {
        title: 'Virtus Staff',
        message: 'Notifiche attive ✅ Qui riceverai turni, ferie e avvisi del Virtus.'
      }
    });
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(0.96 0.008 250);
    --card: oklch(1 0 0);
    --tabbar: oklch(1 0 0);
    --input: oklch(0.94 0.01 250);
    --sheet: oklch(1 0 0);
    --text: oklch(0.22 0.02 250);
    --text-muted: oklch(0.46 0.02 250);
    --text-muted2: oklch(0.56 0.02 250);
    --text-muted3: oklch(0.64 0.02 250);
    --accent: oklch(0.65 0.16 235);
    --accent2: oklch(0.65 0.15 205);
    --danger: oklch(0.65 0.19 30);
    --good: oklch(0.7 0.17 150);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#f5f4fa;height:100%;}
  body{font-family:Inter,-apple-system,system-ui,sans-serif;}
  input::placeholder,textarea::placeholder{color:oklch(0.6 0.02 250);}
  button{cursor:pointer;font-family:inherit;}
  .page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f4fa;padding:24px;}
  #root{width:100%;max-width:420px;}
  .app-shell{width:100%;max-width:420px;height:calc(100vh - 48px);max-height:880px;min-height:600px;background:var(--bg);color:var(--text);border-radius:36px;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(20,15,40,0.14);}
  @media (max-width:480px){
    .page{padding:0;}
    .app-shell{max-width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none;}
  }
  .app-scroll{flex:1;overflow-y:auto;padding:max(48px, calc(env(safe-area-inset-top) + 16px)) 20px 24px;-webkit-overflow-scrolling:touch;}
  .greeting{font-family:Nunito,sans-serif;font-weight:800;font-size:26px;}
  .date-label{color:var(--text-muted);font-size:14px;margin-top:2px;}
  .role-badge{display:inline-block;margin-top:8px;background:rgba(20,15,40,0.06);color:var(--accent2);border-radius:100px;padding:4px 12px;font-size:12px;font-weight:700;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
  .home-tile{background:var(--card);border:none;color:var(--text);border-radius:20px;padding:18px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;position:relative;}
  .home-tile-dot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--danger);}
  .home-tile-icon{font-size:26px;}
  .home-tile-label{font-weight:700;font-size:14.5px;line-height:1.25;}
  .logout-link{display:block;width:100%;text-align:center;background:none;border:none;color:var(--text-muted3);font-size:13px;margin-top:26px;padding:10px;}
  .top-bar{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .back-btn{background:rgba(20,15,40,0.06);border:none;color:var(--text);width:34px;height:34px;border-radius:12px;font-size:18px;flex:none;}
  .top-title{font-family:Nunito,sans-serif;font-weight:800;font-size:20px;flex:1;min-width:0;}
  .screen-title{font-family:Nunito,sans-serif;font-weight:800;font-size:24px;}
  .screen-sub{font-size:13px;color:var(--text-muted);margin-top:2px;}
  .btn-round{background:var(--accent);color:#14121a;border:none;border-radius:12px;width:34px;height:34px;font-weight:800;font-size:19px;line-height:1;flex:none;}
  .chip-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .chip{background:rgba(20,15,40,0.05);color:var(--text-muted);border:none;border-radius:100px;padding:8px 16px;font-weight:700;font-size:13px;}
  .chip-active{background:var(--accent);color:#14121a;}
  .list{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
  .list-item{background:var(--card);border-radius:16px;padding:14px;}
  .bacheca-item{border-left:4px solid transparent;}
  .bacheca-item-urgente{border-left:4px solid var(--danger);background:oklch(0.96 0.03 30);}
  .bacheca-msg{font-size:16.5px;font-weight:700;color:var(--text);line-height:1.4;}
  .bacheca-meta{font-size:10.5px;color:var(--text-muted3);margin-top:8px;}
  .list-item-title{font-size:15px;font-weight:700;}
  .list-item-sub{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.5;}
  .empty-hint,.empty-state{text-align:center;color:var(--text-muted3);padding:40px 0;font-size:14px;width:100%;}
  .badge{display:inline-block;border-radius:100px;padding:3px 10px;font-size:11px;font-weight:700;}
  .badge-urgente{background:oklch(0.93 0.06 30);color:oklch(0.42 0.16 30);}
  .badge-normale{background:rgba(20,15,40,0.06);color:var(--text-muted);}
  .badge-aperto{background:oklch(0.93 0.06 30);color:oklch(0.42 0.16 30);}
  .badge-risolto{background:oklch(0.92 0.06 150);color:oklch(0.38 0.13 150);}
  .row-between{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .btn-resolve{background:rgba(20,15,40,0.06);border:none;color:var(--text);border-radius:100px;padding:6px 14px;font-size:11.5px;font-weight:700;margin-top:8px;white-space:nowrap;}
  .check-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;}
  .checkbox{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
  .checkbox-done{background:var(--good);border-color:var(--good);color:#14121a;}
  .checkbox-todo{color:transparent;}
  .check-body{flex:1;min-width:0;}
  .check-text{font-size:14.5px;font-weight:600;}
  .check-sub{font-size:11px;color:var(--text-muted2);margin-top:3px;}
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);z-index:100;display:flex;align-items:flex-end;}
  .sheet{width:100%;max-height:80%;overflow-y:auto;background:var(--sheet);border-radius:24px 24px 0 0;padding:22px 20px 30px;}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .sheet-title{font-family:Nunito,sans-serif;font-weight:800;font-size:18px;}
  .btn-close{background:rgba(20,15,40,0.06);border:none;color:var(--text);width:30px;height:30px;border-radius:50%;font-size:16px;flex:none;}
  .field{margin-bottom:14px;}
  .field-label{font-size:12px;color:var(--text-muted);margin-bottom:6px;}
  .field input,.field textarea{width:100%;background:var(--input);border:1px solid rgba(20,15,40,0.1);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;font-family:inherit;}
  .field textarea{resize:vertical;min-height:80px;}
  .chips-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip-select{border:none;border-radius:100px;padding:8px 14px;font-weight:700;font-size:12px;background:rgba(20,15,40,0.05);color:var(--text-muted);}
  .chip-select-active{background:var(--accent);color:#14121a;}
  .btn-submit{width:100%;background:var(--accent);color:#14121a;border:none;border-radius:14px;padding:14px;font-weight:800;font-size:15px;margin-top:8px;}
  .login-wrap{padding-top:40px;}
  .login-title{font-family:Nunito,sans-serif;font-weight:800;font-size:22px;text-align:center;}
  .login-sub{text-align:center;color:var(--text-muted);font-size:13.5px;margin-top:6px;}
  .login-list{margin-top:26px;display:flex;flex-direction:column;gap:10px;}
  .login-btn{background:var(--card);border:none;color:var(--text);border-radius:16px;padding:16px;text-align:left;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .login-role{font-size:11.5px;color:var(--text-muted2);font-weight:600;}
  .lb-row{display:flex;align-items:center;justify-content:space-between;margin-top:24px;}
  .lb-name{font-weight:700;font-size:14px;}
  .lb-count{font-size:12px;color:var(--text-muted);}
  .lb-bar-track{height:10px;background:rgba(20,15,40,0.08);border-radius:5px;margin-top:6px;overflow:hidden;}
  .lb-bar-fill{height:100%;border-radius:5px;background:var(--accent);}
  .lb-card{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;}
  .section-label{font-weight:800;font-size:12.5px;color:var(--text-muted2);text-transform:uppercase;letter-spacing:0.03em;margin:16px 0 6px;}
  .week-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .week-nav-btn{background:rgba(20,15,40,0.06);border:none;color:var(--text);width:30px;height:30px;border-radius:10px;font-size:15px;flex:none;}
  .week-nav-label{font-weight:700;font-size:13.5px;}
  .turni-hint{font-size:11.5px;color:var(--text-muted3);margin-top:10px;text-align:center;}
  .fab-voice{position:absolute;right:16px;bottom:20px;width:54px;height:54px;border-radius:50%;background:var(--accent2);border:none;box-shadow:0 6px 16px rgba(20,15,40,0.25);z-index:40;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .voice-mic-wrap{display:flex;justify-content:center;margin-bottom:16px;}
  .voice-mic{width:76px;height:76px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,15,40,0.2);font-size:30px;}
  .voice-status{text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:16px;}
  .voice-transcript{background:var(--input);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-style:italic;}
  .voice-feedback{background:oklch(0.93 0.05 235);border:1px solid oklch(0.7 0.12 235);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;color:oklch(0.35 0.1 235);}
  .voice-input-row{display:flex;gap:8px;margin-bottom:14px;}
  .voice-input-row input{flex:1;background:var(--input);border:1px solid rgba(20,15,40,0.1);border-radius:12px;padding:12px 14px;color:var(--text);font-size:13.5px;outline:none;}
  .voice-input-row button{background:var(--accent);color:#14121a;border:none;border-radius:12px;padding:0 16px;font-weight:800;font-size:14px;}
  .voice-hint{font-size:11.5px;color:var(--text-muted2);line-height:1.6;}
  .cal-headerrow{display:flex;margin-top:14px;}
  .cal-hourcol-spacer{width:32px;flex:none;}
  .cal-dayhead{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--text-muted);line-height:1.3;}
  .cal-dayhead.cal-today{color:var(--accent);}
  .cal-scrollwrap{display:flex;margin-top:4px;max-height:60vh;overflow-y:auto;position:relative;border-top:1px solid rgba(20,15,40,0.06);}
  .cal-hourcol{width:32px;flex:none;position:relative;}
  .cal-hourlabel{position:absolute;left:0;right:4px;text-align:right;font-size:9px;color:var(--text-muted3);transform:translateY(-50%);}
  .cal-days{flex:1;display:flex;position:relative;}
  .cal-daycol{flex:1;position:relative;border-left:1px solid rgba(20,15,40,0.06);}
  .cal-daycol-today{background:rgba(20,15,40,0.025);}
  .cal-hourline{position:absolute;left:0;right:0;border-top:1px solid rgba(20,15,40,0.05);}
  .cal-bar{position:absolute;border-radius:6px;font-size:9px;font-weight:800;padding:2px 1px;overflow:hidden;z-index:5;line-height:1.15;text-align:center;}
  .summary-person{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px;}
  .summary-person-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;}
  .summary-person-head > span:first-child{display:flex;align-items:center;gap:8px;}
  .summary-total{color:var(--accent2);font-weight:800;white-space:nowrap;}
  .ferie-chip{display:inline-block;background:oklch(0.93 0.05 150);color:oklch(0.35 0.1 150);border-radius:100px;padding:3px 9px;font-size:11px;font-weight:700;margin:0 4px 4px 0;}
  .oreferie-title{font-family:Nunito,sans-serif;font-weight:800;font-size:17px;margin-top:22px;margin-bottom:4px;}
  .note-turno-text{font-size:14px;color:var(--text);margin-top:6px;line-height:1.4;}
  .oreferie-title:first-of-type{margin-top:18px;}
  .summary-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .summary-shift{font-size:12.5px;color:var(--text-muted);padding:5px 0 0 18px;}
  .center-loading{text-align:center;color:var(--text-muted2);padding:50px 0;font-size:14px;}
  /* ---------- Pianificatore turni ---------- */
  #root.root-wide{max-width:1200px;}
  .app-shell.app-shell-wide{max-width:1200px;}
  #root .sheet{max-width:560px;margin:0 auto;}
  .pl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .pl-btn{background:var(--card);border:1px solid rgba(20,15,40,0.08);border-radius:100px;padding:8px 14px;font-weight:700;font-size:12.5px;color:var(--text);}
  .pl-btn-primary{background:var(--accent);border-color:var(--accent);color:#14121a;}
  .pl-wrap{margin-top:14px;overflow:auto;max-height:calc(100vh - 250px);border-radius:18px;background:var(--card);-webkit-overflow-scrolling:touch;}
  .pl-grid{border-collapse:separate;border-spacing:0;width:100%;min-width:880px;}
  .pl-grid th{position:sticky;top:0;background:var(--card);z-index:2;font-size:12px;font-weight:700;color:var(--text-muted);padding:12px 6px;border-bottom:1px solid rgba(20,15,40,0.08);text-align:center;}
  .pl-grid th.pl-today{color:var(--accent);}
  .pl-grid td{border-bottom:1px solid rgba(20,15,40,0.06);vertical-align:top;}
  .pl-name,.pl-name-h{position:sticky;left:0;background:var(--card);z-index:1;min-width:150px;width:150px;text-align:left !important;padding:10px 12px;border-right:1px solid rgba(20,15,40,0.06);}
  th.pl-name-h{z-index:3;}
  .pl-name{cursor:pointer;}
  .pl-person{font-weight:700;font-size:13.5px;color:var(--text);}
  .pl-meta{font-size:11px;color:var(--text-muted2);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .pl-tipo{border-radius:100px;padding:1px 7px;font-size:10px;font-weight:700;}
  .pl-tipo-extra{background:#fde6d4;color:#7a3a0c;}
  .pl-tipo-chiamata{background:#e8e3fa;color:#3b2c80;}
  .pl-over{color:var(--danger);font-weight:700;}
  .pl-under{color:var(--text-muted2);font-weight:700;}
  .pl-ok{color:oklch(0.5 0.13 150);font-weight:700;}
  .pl-cell{padding:6px;min-width:104px;}
  .pl-cell-today{background:rgba(20,15,40,0.025);}
  .pl-shift{display:block;width:100%;border:1px solid;border-radius:12px;padding:7px 4px;margin-bottom:5px;text-align:center;}
  .pl-shift-time{font-weight:800;font-size:12.5px;}
  .pl-shift-name{font-size:10.5px;opacity:0.85;margin-top:2px;}
  .pl-ferie{display:block;text-align:center;border-radius:12px;padding:7px 4px;margin-bottom:5px;background:rgba(20,15,40,0.05);color:var(--text-muted);font-size:11px;font-weight:700;}
  .pl-add{width:100%;border:1px dashed rgba(20,15,40,0.15);background:none;border-radius:12px;color:var(--text-muted3);font-size:16px;padding:4px 0;}
  .pl-foot td{font-size:11px;color:var(--text-muted2);padding:9px 6px;text-align:center;background:#f6f5fa;position:sticky;bottom:0;z-index:2;box-shadow:0 -1px 0 rgba(20,15,40,0.08);}
  .pl-foot td.pl-name{background:#f3f2f8;font-weight:700;}
  .pl-model-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .pl-model{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid;border-radius:14px;padding:10px 12px;text-align:left;width:100%;}
  .pl-model-name{font-weight:800;font-size:13.5px;}
  .pl-model-time{font-size:12px;opacity:0.85;}
  .pl-colors{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .pl-color{width:30px;height:30px;border-radius:50%;border:2px solid transparent;}
  .pl-color-active{border-color:var(--text);}
  .btn-danger-soft{width:100%;background:oklch(0.95 0.03 30);color:oklch(0.45 0.16 30);border:none;border-radius:14px;padding:12px;font-weight:800;font-size:14px;margin-top:10px;}
  .pl-sub{font-size:13px;color:var(--text-muted);margin:-8px 0 16px;}
  .pl-rest{text-align:center;font-size:11px;color:var(--text-muted3);padding:10px 0;}
  .pl-tu{display:inline-block;background:var(--accent);color:#14121a;border-radius:100px;padding:0 7px;font-size:10px;font-weight:800;vertical-align:1px;}
  .pl-me td{background:oklch(0.97 0.02 235);}
  .pl-me td.pl-name{background:oklch(0.97 0.02 235);}
  .pl-shift[draggable="true"]{cursor:grab;}
  .pl-shift[draggable="true"]:active{cursor:grabbing;}
  .pl-drop-over{background:oklch(0.95 0.04 235) !important;outline:2px dashed var(--accent);outline-offset:-3px;}
  .pl-dup-box{border-top:1px solid rgba(20,15,40,0.08);margin-top:18px;padding-top:14px;}
  #root,.app-scroll{min-width:0;}
  /* ---------- Ferie e permessi ---------- */
  .as-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;}
  /* ---------- Barra laterale (titolare/responsabili su computer e tablet) ---------- */
  #root.root-side{max-width:1440px;}
  .app-shell.app-shell-side{max-width:1440px;flex-direction:row;}
  .side{width:232px;flex:none;background:var(--card);border-right:1px solid rgba(20,15,40,0.06);display:flex;flex-direction:column;padding:26px 12px 16px;overflow-y:auto;}
  .side-brand{font-family:Nunito,sans-serif;font-weight:800;font-size:19px;padding:0 10px 2px;}
  .side-user{font-size:12px;color:var(--text-muted);padding:0 10px 18px;}
  .side-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;border-radius:12px;padding:9px 10px;font-size:13.5px;font-weight:600;color:var(--text);text-align:left;margin-bottom:2px;}
  .side-item:hover{background:rgba(20,15,40,0.045);}
  .side-item-active,.side-item-active:hover{background:var(--accent);color:#14121a;}
  .side-ico{width:22px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-muted);}
  .side-ico .ico{width:20px;height:20px;}
  .side-item-active .side-ico{color:#14121a;}
  .side-item-active .ico{stroke-width:2.1;}
  .side-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:auto;flex:none;}
  .side-sep{height:1px;background:rgba(20,15,40,0.07);margin:10px 8px;}
  .side-foot{margin-top:auto;padding-top:10px;}
  .side-small{font-size:12.5px;color:var(--text-muted2);font-weight:500;}
  .app-shell-side .app-scroll{flex:1;min-width:0;padding-left:28px;padding-right:28px;}
  .app-shell-side .back-btn{display:none;}
  .app-shell-side .home-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
  /* ---------- Home a colpo d'occhio ---------- */
  .dash{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px;}
  .dash-3{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;}
  .dash-col{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .dash-card{background:var(--card);border-radius:20px;padding:16px;}
  .dash-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}

    .pl-person{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .pl-meta{font-size:10px;gap:4px;}
    .pl-cell{min-width:86px;padding:4px;}
    .pl-shift{padding:5px 2px;border-radius:10px;}
    .pl-shift-time{font-size:11px;}
    .pl-shift-name{font-size:9.5px;}
    .pl-grid th{font-size:11px;padding:10px 4px;}
    .pl-foot td{font-size:9.5px;}
    .pl-btn{padding:7px 11px;font-size:12px;}
  }
</style>
</head>
<body>
<div class="page"><div id="root"></div></div>

<script>
(function(){
  'use strict';

  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKU7UsyatMQ5BQbKeKnro_ATdbjjwUnHSFAzunSGShbgSDBUvuYqMb1OkUgFFnb1WDxQ/exec';
  var STORAGE_KEY = 'virtus-staff-user-v1';
  var LOCALI = ['Bar interno', 'Bar piscina', 'Ristorante'];
  var FASI = ['apertura', 'chiusura'];
  var FORNITORI = ['Partesa', 'New Catering', 'Vini'];
  var GIORNI_LABELS = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  var MESI_SHORT = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  var HOUR_START = 7, HOUR_END = 24;
  var ROW_H = 30;

  var MODULES = [
    { key: 'turni', icon: '🗓️', label: 'Turni' },
    { key: 'assenze', icon: '🌴', label: 'Ferie e permessi' },
    { key: 'checklist', icon: '✅', label: 'Checklist apertura/chiusura' },
    { key: 'bacheca', icon: '📣', label: 'Bacheca' },
    { key: 'vendita', icon: '🍷', label: 'Vendita e prodotto' },
    { key: 'scorte', icon: '📦', label: 'Scorte' },
    { key: 'manutenzione', icon: '🛠️', label: 'Manutenzione' },
    { key: 'documenti', icon: '📄', label: 'Documenti' },
  ];
  var SCREEN_TITLES = {
    turni: 'Turni', checklist: 'Checklist', bacheca: 'Bacheca', vendita: 'Vendita e prodotto',
    scorte: 'Scorte', manutenzione: 'Manutenzione', documenti: 'Documenti', cruscotto: 'Cruscotto',
  };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function nowTime(){
    var d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function parseDate(s){
    var p = String(s).slice(0,10).split('-').map(Number);
    return new Date(p[0], p[1]-1, p[2]);
  }
  function fmtDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function mondayOf(d){
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1 - day);
    var m = new Date(d);
    m.setDate(d.getDate() + diff);
    return m;
  }
  function addDays(d, n){
    var r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }
  function fmtDayLabel(d){
    return d.getDate() + ' ' + MESI_SHORT[d.getMonth()];
  }
  function hourLabel(h){
    return String(h % 24).padStart(2,'0') + ':00';
  }
  function parseHourStr(s){
    if (s == null || s === '') return null;
    var m = String(s).match(/(\d{1,2})/);
    if (!m) return null;
    var h = parseInt(m[1], 10);
    if (h === 0) h = 24;
    return h;
  }
  var PERSON_PALETTE = [
    { bg: '#2a78d6', fg: '#ffffff' },
    { bg: '#eb6834', fg: '#ffffff' },
    { bg: '#1baf7a', fg: '#ffffff' },
    { bg: '#eda100', fg: '#1a1a1a' },
    { bg: '#e87ba4', fg: '#1a1a1a' },
    { bg: '#008300', fg: '#ffffff' },
    { bg: '#4a3aa7', fg: '#ffffff' },
    { bg: '#e34948', fg: '#ffffff' },
  ];
  var EXTRA_COLOR = { bg: '#8a8a8a', fg: '#ffffff' };
  function personColor(nome){
    var users = state.cache.Utenti || [];
    var names = users.map(function(u){ return val(u,'nome'); }).filter(Boolean);
    var idx = names.indexOf(nome);
    if (idx === -1) return EXTRA_COLOR;
    return PERSON_PALETTE[idx % PERSON_PALETTE.length];
  }
  function initials(nome){
    var parts = String(nome||'').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    var s = parts[0][0];
    if (parts.length > 1) s += parts[parts.length-1][0];
    return s.toUpperCase();
  }
  function layoutDayShifts(shifts){
    var sorted = shifts.slice().sort(function(a,b){ return a.oi - b.oi || a.of - b.of; });
    var columns = [];
    sorted.forEach(function(s){
      var placed = false;
      for (var c=0; c<columns.length; c++){
        if (columns[c] <= s.oi){ s.col = c; columns[c] = s.of; placed = true; break; }
      }
      if (!placed){ s.col = columns.length; columns.push(s.of); }
    });
    var totalCols = columns.length;
    sorted.forEach(function(s){ s.totalCols = totalCols; });
    return sorted;
  }
  function normRole(r){
    r = String(r||'').trim().toLowerCase();
    if (r === 'titolare') return 'titolare';
    if (r === 'responsabile') return 'responsabile';
    return 'dipendente';
  }
  function isManager(user){
    var r = normRole(user.ruolo);
    return r === 'responsabile' || r === 'titolare';
  }
  function isTitolare(user){
    return normRole(user.ruolo) === 'titolare';
  }
  function canManageTurni(user){
    return isManager(user) || !!(user && user.gestisceTurni);
  }
  function findKey(row, partial){
    var keys = Object.keys(row);
    var k = keys.find(function(k){ return k.trim().toLowerCase() === partial.toLowerCase(); });
    if (k) return k;
    k = keys.find(function(k){ return k.trim().toLowerCase().indexOf(partial.toLowerCase()) === 0; });
    return k || partial;
  }
  function val(row, partial){
    return row[findKey(row, partial)];
  }

  function rowsLatestTs(rows, urgentOnly){
    var max = 0;
    (rows || []).forEach(function(r){
      if (urgentOnly) {
        var pr = String(val(r,'priorità')||val(r,'priorita')||'').toLowerCase();
        if (pr !== 'urgente') return;
      }
      var idField = findKey(r,'ID');
      var id = r[idField];
      var ts = id ? parseInt(String(id).split('-')[0], 10) : 0;
      if (ts > max) max = ts;
    });
    return max;
  }
  function seenKey(sheetName){
    return 'virtus-staff-seen-' + sheetName + '-' + (state.user ? state.user.nome : '');
  }
  function getSeen(sheetName){
    try { return parseInt(localStorage.getItem(seenKey(sheetName)) || '0', 10); } catch(e){ return 0; }
  }
  function setSeen(sheetName, ts){
    try { localStorage.setItem(seenKey(sheetName), String(ts)); } catch(e){}
  }
  function hasUnseen(sheetName, urgentOnly){
    var rows = state.cache[sheetName];
    if (!rows) return false;
    return rowsLatestTs(rows, urgentOnly) > getSeen(sheetName);
  }

  // ---------- API ----------
  function userToken(){ return (state.user && state.user.token) || ''; }
  function apiGet(sheet){
    var tk = userToken();
    var who = state.user && state.user.nome ? '&nome=' + encodeURIComponent(state.user.nome) : '';
    return fetch(SCRIPT_URL + '?sheet=' + encodeURIComponent(sheet) + (tk ? '&token=' + encodeURIComponent(tk) : '') + who)
      .then(function(r){ return r.json(); })
      .then(function(data){ return Array.isArray(data) ? data : []; })
      .catch(function(){ return null; });
  }
  function apiPost(body){
    if (userToken() && !body.token) body.token = userToken();
    return fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) })
      .then(function(r){ return r.json(); })
      .catch(function(){ return { error: 'Connessione non riuscita' }; })
      .then(function(res){
        // Chiave di sessione scaduta o mancante: si rientra con il PIN
        if (res && res.auth) { alert(res.error); logout(); }
        return res;
      });
  }

  // ---------- State ----------
  var state = {
    screen: 'login',
    user: null,
    users: [],
    usersLoaded: false,
    cache: {},
    loading: {},
    activeModal: null,
    form: {},
    filters: { locale: LOCALI[0], fase: FASI[0], scorteFilter: 'aperte', manutenzioneFilter: 'aperte' },
    turniWeekStart: fmtDate(mondayOf(new Date())),
    pendingCell: null,
    busy: false,
    voiceOpen: false, voiceListening: false, voiceTranscript: '', voiceFeedback: '', voiceInputText: '',
    pendingLoginUser: null, loginPinInput: '', loginPinConfirm: '', loginPinError: '', loginSetupMode: false,
  };
  var recognition = null;

  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { state.user = JSON.parse(saved); state.screen = 'home'; }
    // Titolare/responsabili senza chiave di sessione: devono rientrare con il PIN
    if (state.user && canManageTurni(state.user) && !state.user.token) { state.user = null; state.screen = 'login'; }
  } catch(e){}
  if (state.user && state.user.nome) identifyOneSignalUser(state.user.nome);

  function identifyOneSignalUser(nome){
    try {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function(OneSignal){
        OneSignal.login(nome).catch(function(){});
      });
    } catch(e){}
  }

  function render(){
    var inner = state.screen === 'login' ? renderLogin() : renderScreen();
    // Titolare e responsabili su computer/tablet: menù a barra laterale
    var side = usaBarraLaterale();
    var wide = !side && (state.screen === 'planner' || state.screen === 'turni' || state.screen === 'report' || (state.screen === 'assenze' && state.asTab === 'team'));
    // Su computer chi gestisce vede tutte le schermate più larghe
    var mid = !side && !wide && state.screen !== 'login' && state.user && isManager(state.user) && window.innerWidth >= 900;
    var showVoice = state.screen !== 'login' && !wide && !side;
    document.getElementById('root').className = side ? 'root-side' : wide ? 'root-wide' : mid ? 'root-mid' : '';
    // Telefono (e chi non ha la barra laterale): menù a icone in basso
    var tabs = !side && state.screen !== 'login' && !!state.user;
    if (tabs) showVoice = state.screen !== 'planner';
    var html = '<div class="app-shell' + (side ? ' app-shell-side' : wide ? ' app-shell-wide' : mid ? ' app-shell-mid' : '') + (tabs ? ' app-shell-tabs' : '') + '">' +
      (side ? renderSidebar() : '') + '<div class="app-scroll">' + inner + '</div>' + (tabs ? renderTabbar() : '') +
      (showVoice ? '<button class="fab-voice" onclick="App.openVoice()">🎙️</button>' : '') +
      '</div>' +
      (state.screen !== 'login' && state.activeModal ? renderModal() : '') +
      (state.voiceOpen ? renderVoiceSheet() : '');
    document.getElementById('root').innerHTML = html;
    // Panoramica Team: porta in vista il giorno di oggi (utile sul telefono)
    if (state.screen === 'assenze' && state.asTab === 'team' && state.asScrolledMonth !== state.asMonth) {
      var oggi = document.querySelector('.as-team th[data-today]'), wrap = document.querySelector('.as-team-wrap');
      if (wrap && document.querySelector('.as-team')) {
        if (oggi) wrap.scrollLeft = Math.max(0, oggi.offsetLeft - 150);
        state.asScrolledMonth = state.asMonth;
      }
    }
  }

  function ensureLoaded(sheet){
    if (state.cache[sheet] || state.loading[sheet]) return;
    state.loading[sheet] = true;
    apiGet(sheet).then(function(data){
      state.loading[sheet] = false;
      state.cache[sheet] = data || [];
      render();
    });
  }
  function reload(sheet){
    state.cache[sheet] = null;
    ensureLoaded(sheet);
  }

  // ---------- Login ----------
  function renderLogin(){
    if (!state.usersLoaded) {
      if (!state.loading.Utenti) {
        state.loading.Utenti = true;
        apiGet('Utenti').then(function(data){
          state.loading.Utenti = false;
          state.usersLoaded = true;
          // Extra e a chiamata compaiono solo nel pianificatore, non nell'elenco di accesso
          state.users = (data || []).filter(function(u){ return String(val(u,'nome')||'').trim() && tipoOf(u) === 'fisso'; });
          render();
        });
      }
      return '<div class="login-wrap"><div class="center-loading">Carico l\'elenco dello staff…</div></div>';
    }
    if (state.pendingLoginUser && state.loginSetupMode) {
      var setupNome = state.pendingLoginUser;
      if (state.busy) return '<div class="login-wrap"><div class="center-loading">Salvataggio…</div></div>';
      var setupRow = state.users.find(function(u){ return val(u,'nome') === setupNome; });
      var setupManager = setupRow && (normRole(val(setupRow,'ruolo')) !== 'dipendente' || String(val(setupRow,'gestisce turni')||'').trim());
      return '<div class="login-wrap"><div class="login-title">Ciao, ' + esc(setupNome) + '</div>' +
        '<div class="login-sub">' + (setupManager ? 'Per gestire turni e staff devi impostare un PIN (da 4 a 8 cifre).' : 'Vuoi impostare un PIN per proteggere il tuo accesso? (facoltativo)') + '</div>' +
        '<div class="field" style="margin-top:24px;"><input type="password" inputmode="numeric" maxlength="8" autofocus value="' + esc(state.loginPinInput||'') + '" oninput="App.updateLoginPin(this.value)" placeholder="Nuovo PIN"/></div>' +
        '<div class="field"><input type="password" inputmode="numeric" maxlength="8" value="' + esc(state.loginPinConfirm||'') + '" oninput="App.updateLoginPinConfirm(this.value)" placeholder="Ripeti PIN"/></div>' +
        (state.loginPinError ? '<div class="voice-feedback" style="background:oklch(0.93 0.06 30);color:oklch(0.42 0.16 30);border-color:oklch(0.7 0.14 30);">' + esc(state.loginPinError) + '</div>' : '') +
        '<button class="btn-submit" onclick="App.submitLoginPinSetup()">Imposta ed entra</button>' +
        (setupManager ? '<button class="logout-link" onclick="App.cancelLoginPin()">Torna indietro</button>' :
          '<button class="logout-link" onclick="App.skipLoginPinSetup()">Salta per ora, entra senza PIN</button>') +
        '</div>';
    }
    if (state.pendingLoginUser) {
      var pendingNome = state.pendingLoginUser;
      if (state.busy) return '<div class="login-wrap"><div class="center-loading">Controllo il PIN…</div></div>';
      return '<div class="login-wrap"><div class="login-title">Ciao, ' + esc(pendingNome) + '</div>' +
        '<div class="login-sub">Inserisci il tuo PIN</div>' +
        '<div class="field" style="margin-top:24px;"><input type="password" inputmode="numeric" maxlength="8" autofocus value="' + esc(state.loginPinInput||'') + '" oninput="App.updateLoginPin(this.value)" onkeydown="if(event.key===\'Enter\') App.submitLoginPin()" placeholder="PIN"/></div>' +
        (state.loginPinError ? '<div class="voice-feedback" style="background:oklch(0.93 0.06 30);color:oklch(0.42 0.16 30);border-color:oklch(0.7 0.14 30);">' + esc(state.loginPinError) + '</div>' : '') +
        '<button class="btn-submit" onclick="App.submitLoginPin()">Entra</button>' +
        '<button class="logout-link" onclick="App.cancelLoginPin()">Torna indietro</button>' +
        '</div>';
    }
    var items = state.users.map(function(u){
      var nome = val(u, 'nome');
      var ruolo = normRole(val(u, 'ruolo'));
      var label = ruolo === 'titolare' ? 'Titolare' : ruolo === 'responsabile' ? 'Responsabile' : 'Dipendente';
      return '<button class="login-btn" onclick="App.selectLoginUser(\'' + esc(nome).replace(/'/g,"\\'") + '\')">' +
        '<span>' + esc(nome) + '</span><span class="login-role">' + label + '</span></button>';
    }).join('');
    return '<div class="login-wrap"><div class="login-title">Virtus Tennis</div>' +
      '<div class="login-sub">Tocca il tuo nome per entrare</div>' +
      '<div class="login-list">' + (items || '<div class="empty-hint">Nessun nominativo trovato nel foglio Utenti.</div>') + '</div></div>';
  }

  function login(nome, token){
    var row = state.users.find(function(u){ return val(u,'nome') === nome; });
    var ruolo = row ? normRole(val(row,'ruolo')) : 'dipendente';
    var gestisceTurni = row ? !!String(val(row,'gestisce turni')||'').trim() : false;
    state.user = { nome: nome, ruolo: ruolo, gestisceTurni: gestisceTurni, token: token || '' };
    state.cache = {}; // ricarica i dati con i permessi giusti
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.user)); } catch(e){}
    identifyOneSignalUser(nome);
    state.pendingLoginUser = null;
    state.loginPinInput = '';
    state.loginPinConfirm = '';
    state.loginPinError = '';
    state.loginSetupMode = false;
    state.screen = 'home';
    render();
  }
  function logout(){
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    try {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function(OneSignal){ OneSignal.logout().catch(function(){}); });
    } catch(e){}
    state.user = null;
    state.screen = 'login';
    state.usersLoaded = false;
    render();
  }
  function enableNotifiche(){
    var done = false;
    function finish(msg){
      if (done) return;
      done = true;
      alert(msg);
    }
    setTimeout(function(){
      finish('Il sistema delle notifiche non ha risposto entro 20 secondi.\n\nControlla la connessione internet e riprova. Se continua, verifichiamo insieme la configurazione OneSignal.');
    }, 20000);
    try {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(function(OneSignal){
        try {
          var supported = OneSignal.Notifications.isPushSupported();
          if (!supported) {
            finish('Questo dispositivo/browser non supporta le notifiche push.\n\nSu iPhone serve iOS 16.4 o più recente E l\'app aggiunta alla schermata Home (non basta aprirla da Safari).');
            return;
          }
        } catch (e) {
          finish('Errore nel controllo compatibilità: ' + (e && e.message ? e.message : e));
          return;
        }
        OneSignal.Notifications.requestPermission().then(function(){
          if (!OneSignal.Notifications.permission) {
            finish('Permesso non concesso (hai rifiutato, o le notifiche sono bloccate nelle impostazioni del telefono per questa app).');
            return;
          }
          var tries = 0;
          var check = function(){
            tries++;
            var sub = OneSignal.User.PushSubscription;
            if (sub.id || tries >= 10) {
              var info = 'Permesso: concesso\nIscritto: ' + (sub.optedIn ? 'si' : 'no') + '\nID iscrizione: ' + (sub.id || '(nessuno dopo ' + tries + ' tentativi)');
              finish('Notifiche attivate su questo telefono.\n\n' + info);
            } else {
              setTimeout(check, 1000);
            }
          };
          check();
        }).catch(function(err){
          finish('Errore attivazione notifiche: ' + (err && err.message ? err.message : err));
        });
      });
    } catch (e) {
      finish('Errore avvio notifiche: ' + (e && e.message ? e.message : e));
    }
  }
  function diagnosticaNotifiche(){
    if (!('serviceWorker' in navigator)) {
      alert('Diagnostica: questo browser non supporta i service worker (necessari per le notifiche).');
      return;
    }
    navigator.serviceWorker.getRegistrations().then(function(regs){
      var elenco = regs.length ? regs.map(function(r){ return '- scope: ' + r.scope + (r.active ? ' (attivo)' : ' (non attivo)'); }).join('\n') : '(nessuna registrazione trovata)';
      navigator.serviceWorker.register('/virtus-staff-app/OneSignalSDKWorker.js', { scope: '/virtus-staff-app/' }).then(function(reg){
        alert('Diagnostica notifiche\n\nRegistrazioni esistenti:\n' + elenco + '\n\nNuova registrazione: RIUSCITA\nScope: ' + reg.scope);
      }).catch(function(err){
        alert('Diagnostica notifiche\n\nRegistrazioni esistenti:\n' + elenco + '\n\nNuova registrazione: FALLITA\nErrore: ' + (err && err.message ? err.message : err));
      });
    }).catch(function(err){
      alert('Diagnostica: errore nel leggere le registrazioni esistenti: ' + (err && err.message ? err.message : err));
    });
  }
  function selectLoginUser(nome){
    var row = state.users.find(function(u){ return val(u,'nome') === nome; });
    var pin = row ? String(val(row,'hapin')||'').trim() : '';
    state.pendingLoginUser = nome;
    state.loginPinInput = '';
    state.loginPinConfirm = '';
    state.loginPinError = '';
    state.loginSetupMode = !pin;
    render();
  }
  function updateLoginPin(value){ state.loginPinInput = value; }
  function updateLoginPinConfirm(value){ state.loginPinConfirm = value; }
  function cancelLoginPin(){
    state.pendingLoginUser = null;
    state.loginPinInput = '';
    state.loginPinConfirm = '';
    state.loginPinError = '';
    state.loginSetupMode = false;
    render();
  }
  function skipLoginPinSetup(){
    login(state.pendingLoginUser);
  }
  function submitLoginPinSetup(){
    var nome = state.pendingLoginUser;
    if (!nome || state.busy) return;
    var pin = String(state.loginPinInput||'').trim();
    var confirmPin = String(state.loginPinConfirm||'').trim();
    if (!pin) { state.loginPinError = 'Scrivi un PIN.'; render(); return; }
    if (pin !== confirmPin) {
      state.loginPinError = 'I due PIN non coincidono.';
      state.loginPinInput = ''; state.loginPinConfirm = '';
      render();
      return;
    }
    if (!/^\d{4,8}$/.test(pin)) { state.loginPinError = 'Il PIN deve avere da 4 a 8 cifre.'; render(); return; }
    state.busy = true;
    render();
    apiPost({ action: 'set_pin', nome: nome, pin: pin })
      .then(function(res){
        state.busy = false;
        if (!res || res.error) { state.loginPinError = (res && res.error) || 'Errore'; render(); return; }
        login(nome, res.token);
      });
  }
  function submitLoginPin(){
    var nome = state.pendingLoginUser;
    if (!nome || state.busy) return;
    var entered = String(state.loginPinInput||'').trim();
    if (!entered) { state.loginPinError = 'Scrivi il PIN.'; render(); return; }
    state.busy = true;
    render();
    apiPost({ action: 'login', nome: nome, pin: entered }).then(function(res){
      state.busy = false;
      if (res && res.ok) { login(nome, res.token); return; }
      state.loginPinError = (res && res.error) || 'PIN errato, riprova.';
      state.loginPinInput = '';
      render();
    });
  }

  // ---------- Home ----------
  var DOT_SHEETS = { bacheca: { sheet: 'Bacheca', urgentOnly: true }, turni: { sheet: 'Turni', urgentOnly: false }, scorte: { sheet: 'Scorte', urgentOnly: false }, manutenzione: { sheet: 'Manutenzione', urgentOnly: false } };
  function renderHome(){
    Object.keys(DOT_SHEETS).forEach(function(k){ ensureLoaded(DOT_SHEETS[k].sheet); });
    var mods = MODULES.filter(function(m){ return !(m.key === 'turni' && canManageTurni(state.user)); });
    var tiles = mods.map(function(m){
      var unseen = false;
      if (m.key === 'assenze') {
        if (isTitolare(state.user)) {
          ensureLoaded('Assenze');
          unseen = !!state.cache.Assenze && asRows().some(function(a){ return a.stato === 'in attesa'; });
        }
      } else if (m.key === 'bacheca') {
        var bRows = state.cache.Bacheca;
        unseen = !!bRows && rowsLatestTs(bachecaVisibleRows(bRows), true) > getSeen('Bacheca');
      } else {
        var dc = DOT_SHEETS[m.key];
        unseen = !!(dc && hasUnseen(dc.sheet, dc.urgentOnly));
      }
      var dot = unseen ? '<span class="home-tile-dot"></span>' : '';
      return '<button class="home-tile" onclick="App.goto(\'' + m.key + '\')">' + dot +
        '<div class="home-tile-icon">' + m.icon + '</div><div class="home-tile-label">' + m.label + '</div></button>';
    }).join('');
    if (canManageTurni(state.user)) {
      var rtDot = '';
      if (isTitolare(state.user)) {
        ensureLoaded('Richieste_Turno');
        if (state.cache.Richieste_Turno && rtPending().length) rtDot = '<span class="home-tile-dot"></span>';
      }
      tiles = '<button class="home-tile" style="grid-column:1 / -1;background:var(--accent);" onclick="App.goto(\'planner\')">' + rtDot +
        '<div class="home-tile-icon">🧩</div><div class="home-tile-label">Pianificatore turni<br><span style="font-weight:500;font-size:12px;">Crea i turni di tutto lo staff</span></div></button>' + tiles;
    }
    if (isManager(state.user)) {
      tiles += '<button class="home-tile" onclick="App.goto(\'report\')">' +
        '<div class="home-tile-icon">⏱️</div><div class="home-tile-label">Report ore</div></button>';
      tiles += '<button class="home-tile" onclick="App.goto(\'cruscotto\')">' +
        '<div class="home-tile-icon">📊</div><div class="home-tile-label">Cruscotto</div></button>';
    }
    var roleLabel = state.user.ruolo === 'titolare' ? 'Titolare' : state.user.ruolo === 'responsabile' ? 'Responsabile' : 'Dipendente';
    var oggi = new Date();
    return '<div>' +
      '<div class="greeting">Ciao, ' + esc(state.user.nome) + ' 👋</div>' +
      '<div class="date-label">' + GIORNI_LUNGHI[oggi.getDay()] + ' ' + oggi.getDate() + ' ' + MESI_LUNGHI[oggi.getMonth()].toLowerCase() + '</div>' +
      '<div class="role-badge">' + roleLabel + '</div>' +
      renderDashboard() +
      '<div class="home-extra"><div class="section-label" style="margin-top:26px;">Sezioni</div>' +
      '<div class="home-grid" style="margin-top:8px;">' + tiles + '</div>' +
      '<button class="logout-link" onclick="App.enableNotifiche()">🔔 Attiva notifiche</button>' +
      '<button class="logout-link" onclick="App.diagnosticaNotifiche()">🔧 Diagnostica notifiche</button>' +
      '<button class="logout-link" onclick="App.openModal(\'set_pin\')">Imposta il tuo PIN</button>' +
      '<button class="logout-link" onclick="App.logout()">Cambia utente</button></div>' +
    '</div>';

  // ---------- Turni ----------
  function renderTurni(){
    ensureLoaded('Turni');
    ensureLoaded('Utenti');
    ensureLoaded('Ferie');
    var rows = state.cache.Turni;
    var users = state.cache.Utenti;
    var manager = canManageTurni(state.user);

    var weekStart = parseDate(state.turniWeekStart);
    var days = [];
    for (var i=0;i<7;i++) days.push(addDays(weekStart, i));
    var t = todayStr();

    var weekNav = '<div class="week-nav"><button class="week-nav-btn" onclick="App.shiftWeek(-1)">‹</button>' +
      '<div class="week-nav-label">' + esc(fmtDayLabel(days[0])) + ' – ' + esc(fmtDayLabel(days[6])) + '</div>' +
      '<button class="week-nav-btn" onclick="App.shiftWeek(1)">›</button></div>';

    var body;
    if (!rows || !users) body = '<div class="center-loading">Carico i turni…</div>';
    else {
      setSeen('Turni', rowsLatestTs(rows, false));
      var totalHours = HOUR_END - HOUR_START;
      var gridHeight = totalHours * ROW_H;

      var hourLabelsHtml = '';
      for (var idx=0; idx<totalHours; idx++){
        hourLabelsHtml += '<div class="cal-hourlabel" style="top:' + (idx*ROW_H) + 'px;">' + hourLabel(HOUR_START+idx) + '</div>';
      }

      var dayHeaderHtml = days.map(function(d){
        var isToday = fmtDate(d) === t;
        return '<div class="cal-dayhead' + (isToday?' cal-today':'') + '">' + GIORNI_LABELS[(d.getDay()+6)%7] + '<br>' + d.getDate() + '</div>';
      }).join('');

      var dayColsHtml = days.map(function(d){
        var dateStr = fmtDate(d);
        var isToday = dateStr === t;
        var lines = '';
        for (var i2=0; i2<totalHours; i2++){
          var hourStart = HOUR_START + i2;
          var click = manager ? ' onclick="App.openTurnoCell(\'' + dateStr + '\',' + hourStart + ')"' : '';
          lines += '<div class="cal-hourline" style="top:' + (i2*ROW_H) + 'px;height:' + ROW_H + 'px;"' + click + '></div>';
        }
        var dayTurni = rows.filter(function(r){ return String(val(r,'data')).slice(0,10) === dateStr; });
        var shifts = dayTurni.map(function(r){
          var oi = parseHourStr(val(r,'ora inizio'));
          var of = parseHourStr(val(r,'ora fine'));
          var idField = findKey(r,'ID');
          return { oi: oi, of: of, id: r[idField], nome: String(val(r,'dipendente')||'') };
        }).filter(function(s){ return s.oi != null && s.of != null && s.of > s.oi; });
        var laidOut = layoutDayShifts(shifts);
        var barsHtml = laidOut.map(function(s){
          var top = (s.oi - HOUR_START) * ROW_H;
          var height = (s.of - s.oi) * ROW_H;
          var leftPct = (s.col / s.totalCols) * 100;
          var widthPct = (1 / s.totalCols) * 100;
          var c = personColor(s.nome);
          var click = (manager && s.id) ? ' onclick="App.removeTurno(\'' + esc(s.id) + '\',\'' + esc(s.nome).replace(/'/g,"\\'") + '\',\'' + hourLabel(s.oi) + '\',\'' + hourLabel(s.of) + '\')"' : '';
          return '<div class="cal-bar"' + click + ' style="top:' + top + 'px;height:' + height + 'px;left:calc(' + leftPct + '% + 1px);width:calc(' + widthPct + '% - 2px);background:' + c.bg + ';color:' + c.fg + ';" title="' + esc(s.nome) + ' ' + hourLabel(s.oi) + '–' + hourLabel(s.of) + '">' + esc(initials(s.nome)) + '</div>';
        }).join('');
        return '<div class="cal-daycol' + (isToday?' cal-daycol-today':'') + '" style="height:' + gridHeight + 'px;">' + lines + barsHtml + '</div>';
      }).join('');

      body = '<div class="cal-headerrow"><div class="cal-hourcol-spacer"></div>' + dayHeaderHtml + '</div>' +
        '<div class="cal-scrollwrap"><div class="cal-hourcol" style="height:' + gridHeight + 'px;">' + hourLabelsHtml + '</div>' +
        '<div class="cal-days">' + dayColsHtml + '</div></div>' +
        (manager ? '<div class="turni-hint">Tocca una cella vuota per aggiungere, tocca una barra per rimuoverla.</div>' : '') +
        renderTurniSummary(days, rows);
    }
    var addBtn = manager ? '<button class="btn-round" onclick="App.openTurnoAdd()">+</button>' : '';
    return '<div>' + renderTopBarWithAction('Turni', addBtn) + weekNav + body + renderMieRichiesteTurno() + renderNotePreferenze() + '</div>';
  }

  function renderNotePreferenze(){
    ensureLoaded('Note_Turni');
    var rows = state.cache.Note_Turni;
    var titleHtml = '<div class="oreferie-title" style="margin-top:26px;">Note e preferenze turni</div>' +
      '<div class="row-between"><div class="screen-sub">La tua nota su turni/orari preferiti</div>' +
      '<button class="btn-round" onclick="App.openModal(\'nota_turno\')">+</button></div>';
    if (!rows) return titleHtml + '<div class="center-loading">Carico…</div>';

    var latest = {};
    rows.forEach(function(r){
      var nome = String(val(r,'dipendente')||'').trim();
      if (!nome) return;
      var idField = findKey(r,'ID');
      var id = r[idField];
      var nota = val(r,'nota');
      var ts = id ? parseInt(String(id).split('-')[0], 10) : 0;
      if (!latest[nome] || ts > latest[nome].ts) latest[nome] = { nota: nota, id: id, ts: ts };
    });
    var names = Object.keys(latest).sort(function(a,b){ return a.localeCompare(b); });
    var content = names.length ? names.map(function(nome){
      var entry = latest[nome];
      var c = personColor(nome);
      var canDelete = entry.id && (nome === state.user.nome || isManager(state.user));
      var delBtn = canDelete ? '<button class="btn-resolve" style="margin-top:8px;" onclick="App.removeNotaTurno(\'' + esc(entry.id) + '\')">Elimina</button>' : '';
      return '<div class="summary-person"><div class="summary-person-head"><span><span class="summary-dot" style="background:' + c.bg + ';"></span>' + esc(nome) + '</span></div>' +
        '<div class="note-turno-text">' + esc(entry.nota) + '</div>' + delBtn + '</div>';
    }).join('') : '<div class="empty-hint">Nessuna nota ancora.</div>';
    return titleHtml + content;
  }

  function renderTurniSummary(days, rows){
    var weekDates = days.map(function(d){ return fmtDate(d); });
    var weekRows = rows.filter(function(r){ return weekDates.indexOf(String(val(r,'data')).slice(0,10)) !== -1; });
    var byPerson = {};
    weekRows.forEach(function(r){
      var nome = String(val(r,'dipendente')||'').trim();
      var oi = parseHourStr(val(r,'ora inizio'));
      var of = parseHourStr(val(r,'ora fine'));
      if (!nome || oi == null || of == null) return;
      if (!byPerson[nome]) byPerson[nome] = [];
      byPerson[nome].push({ data: String(val(r,'data')).slice(0,10), oi: oi, of: of });
    });
    var names = Object.keys(byPerson).sort(function(a,b){ return a.localeCompare(b); });
    var content = names.length ? names.map(function(nome){
      var shifts = byPerson[nome].sort(function(a,b){ return a.data.localeCompare(b.data) || a.oi - b.oi; });
      var c = personColor(nome);
      var totalOre = shifts.reduce(function(sum,s){ return sum + (s.of - s.oi); }, 0);
      var shiftsHtml = shifts.map(function(s){
        var d = parseDate(s.data);
        var giorno = GIORNI_LABELS[(d.getDay()+6)%7] + ' ' + d.getDate();
        return '<div class="summary-shift">' + esc(giorno) + ' · ' + hourLabel(s.oi) + '–' + hourLabel(s.of) + '</div>';
      }).join('');
      return '<div class="summary-person">' +
        '<div class="summary-person-head"><span><span class="summary-dot" style="background:' + c.bg + ';"></span>' + esc(nome) + '</span>' +
        '<span class="summary-total">' + totalOre + ' h</span></div>' +
        shiftsHtml +
        '</div>';
    }).join('') : '<div class="empty-hint">Nessun turno questa settimana.</div>';
    return '<div class="section-label">Riepilogo settimana</div>' + content;
  }

  function renderTopBarWithAction(title, actionHtml){
    return '<div class="top-bar"><button class="back-btn" onclick="App.goHome()">‹</button>' +
      '<div class="top-title">' + esc(title) + '</div>' + actionHtml + '</div>';
  }

  // ---------- Checklist ----------
  function renderChecklist(){
    ensureLoaded('Checklist');
    ensureLoaded('Checklist_Log');
    var items = state.cache.Checklist;
    var log = state.cache.Checklist_Log;
    var f = state.filters;

    var localeChips = LOCALI.map(function(l){
      return '<button class="chip-select ' + (f.locale===l?'chip-select-active':'') + '" onclick="App.setFilter(\'locale\',\'' + l + '\')">' + esc(l) + '</button>';
    }).join('');
    var faseChips = FASI.map(function(fa){
      return '<button class="chip-select ' + (f.fase===fa?'chip-select-active':'') + '" onclick="App.setFilter(\'fase\',\'' + fa + '\')">' + esc(fa) + '</button>';
    }).join('');

    var body;
    if (!items || !log) body = '<div class="center-loading">Carico la checklist…</div>';
    else {
      var t = todayStr();
      var matching = items.filter(function(it){
        return String(val(it,'locale')).trim().toLowerCase() === f.locale.toLowerCase() &&
          String(val(it,'fase')).trim().toLowerCase() === f.fase.toLowerCase();
      });
      body = matching.length ? '<div class="list">' + matching.map(function(it){
        var attivita = val(it,'attività') || val(it,'attivita');
        var doneEntry = log.find(function(l){
          return String(val(l,'data')) === t &&
            String(val(l,'locale')).trim().toLowerCase() === f.locale.toLowerCase() &&
            String(val(l,'fase')).trim().toLowerCase() === f.fase.toLowerCase() &&
            String(val(l,'attività')||val(l,'attivita')) === String(attivita);
        });
        var done = !!doneEntry;
        var idSafe = esc(attivita).replace(/'/g,"\\'");
        return '<div class="check-item">' +
          '<div class="checkbox ' + (done?'checkbox-done':'checkbox-todo') + '" onclick="' + (done?'':'App.checkItem(\'' + idSafe + '\')') + '">' + (done?'✓':'') + '</div>' +
          '<div class="check-body"><div class="check-text">' + esc(attivita) + '</div>' +
          (done ? '<div class="check-sub">Fatto da ' + esc(val(doneEntry,'dipendente')) + ' alle ' + esc(val(doneEntry,'ora')) + '</div>' : '') +
          '</div></div>';
      }).join('') + '</div>' : '<div class="empty-state">Nessuna attività impostata per ' + esc(f.locale) + ' · ' + esc(f.fase) + '.</div>';
    }
    return '<div>' + renderTopBar('Checklist') +
      '<div class="chip-row">' + localeChips + '</div>' +
      '<div class="chip-row">' + faseChips + '</div>' +
      body + '</div>';
  }

  function checkItem(attivita){

    var data = { Data: todayStr(), Dipendente: state.user.nome, Locale: f.locale, Fase: f.fase, 'Attività': attivita, Ora: nowTime() };
    apiPost({ sheet: 'Checklist_Log', data: data }).then(function(){ reload('Checklist_Log'); });

      return !dest || dest === state.user.nome || isManager(state.user);

          '<div class="bacheca-msg">' + esc(val(r,'messaggio')) + '</div>' +

  // ---------- Scorte / Manutenzione (schema comune) ----------
  function renderIssueScreen(sheetName, filterKey, itemLabelField, formType, screenTitle){
    ensureLoaded(sheetName);
    var rows = state.cache[sheetName];
    var f = state.filters[filterKey];
    var chips = ['aperte','risolte','tutte'].map(function(k){
      var lbl = { aperte:'Aperte', risolte:'Risolte', tutte:'Tutte' }[k];
      return '<button class="chip ' + (f===k?'chip-active':'') + '" onclick="App.setFilter(\'' + filterKey + '\',\'' + k + '\')">' + lbl + '</button>';
    }).join('');
    var body;
    if (!rows) body = '<div class="center-loading">Carico…</div>';
    else {
      setSeen(sheetName, rowsLatestTs(rows, false));
      var filtered = rows.filter(function(r){
        var stato = String(val(r,'stato')||'').toLowerCase();
        var resolved = stato.indexOf('risolt') === 0;
        if (f === 'aperte') return !resolved;
        if (f === 'risolte') return resolved;
        return true;
      });
      body = filtered.length ? '<div class="list">' + filtered.map(function(r){
        var stato = String(val(r,'stato')||'').toLowerCase();
        var resolved = stato.indexOf('risolt') === 0;
        var idField = findKey(r, 'ID');
        var id = r[idField];
        return '<div class="list-item"><div class="row-between"><div class="list-item-title">' + esc(val(r,itemLabelField)) + '</div>' +

          '<div class="list-item-sub">' + esc(val(r,'locale')) + ' · segnalato da ' + esc(val(r,'segnalato da')) + ' · ' + esc(val(r,'data')) + '</div>' +
          (val(r,'note') ? '<div class="list-item-sub">' + esc(val(r,'note')) + '</div>' : '') +
          (resolved ? '<div class="list-item-sub">Risolto da ' + esc(val(r,'risolto da')) + '</div>' :
            (id ? '<button class="btn-resolve" onclick="App.resolveIssue(\'' + sheetName + '\',\'' + esc(id) + '\')">Segna risolto</button>' :
              '<div class="list-item-sub" style="color:var(--text-muted3);">Aggiungi la colonna ID nel foglio per poter risolvere da qui.</div>')) +
          '</div>';
      }).join('') + '</div>' : '<div class="empty-state">Nessuna segnalazione.</div>';

    return '<div>' + renderTopBarWithAction(screenTitle, addBtn) + '<div class="chip-row">' + chips + '</div>' + body + '</div>';

  // ---------- Scorte (raggruppate per fornitore) ----------
  function renderScorte(){
    ensureLoaded('Scorte');
    ensureLoaded('Catalogo_Fornitori');
    var rows = state.cache.Scorte;
    var f = state.filters.scorteFilter;
    var chips = ['aperte','risolte','tutte'].map(function(k){
      var lbl = { aperte:'Da ordinare', risolte:'Ordinati', tutte:'Tutte' }[k];
      return '<button class="chip ' + (f===k?'chip-active':'') + '" onclick="App.setFilter(\'scorteFilter\',\'' + k + '\')">' + lbl + '</button>';
    }).join('');
    var body;
    if (!rows) body = '<div class="center-loading">Carico…</div>';
    else {
      setSeen('Scorte', rowsLatestTs(rows, false));
      var filtered = rows.filter(function(r){
        var stato = String(val(r,'stato')||'').toLowerCase();
        var resolved = stato.indexOf('risolt') === 0;
        if (f === 'aperte') return !resolved;
        if (f === 'risolte') return resolved;
        return true;
      });
      var groups = FORNITORI.concat(['Altro']);
      var sectionsHtml = groups.map(function(g){
        var itemsInGroup = filtered.filter(function(r){
          var fo = String(val(r,'fornitore')||'').trim();
          if (g === 'Altro') return !FORNITORI.some(function(x){ return x.toLowerCase() === fo.toLowerCase(); });
          return fo.toLowerCase() === g.toLowerCase();
        });
        if (!itemsInGroup.length) return '';
        var itemsHtml = itemsInGroup.map(function(r){
          var stato = String(val(r,'stato')||'').toLowerCase();
          var resolved = stato.indexOf('risolt') === 0;
          var idField = findKey(r, 'ID');
          var id = r[idField];
          return '<div class="list-item"><div class="row-between"><div class="list-item-title">' + esc(val(r,'prodotto')) + '</div>' +
            '<span class="badge badge-' + (resolved?'risolto':'aperto') + '">' + (resolved?'Ordinato':'Da ordinare') + '</span></div>' +
            '<div class="list-item-sub">segnalato da ' + esc(val(r,'segnalato da')) + ' · ' + esc(val(r,'data')) + '</div>' +
            (val(r,'note') ? '<div class="list-item-sub">' + esc(val(r,'note')) + '</div>' : '') +
            (resolved ? '<div class="list-item-sub">Ordinato da ' + esc(val(r,'risolto da')) + '</div>' :
              (id ? '<button class="btn-resolve" onclick="App.resolveIssue(\'Scorte\',\'' + esc(id) + '\')">Segna come ordinato</button>' :
                '<div class="list-item-sub" style="color:var(--text-muted3);">Aggiungi la colonna ID nel foglio per poter aggiornare da qui.</div>')) +
            '</div>';
        }).join('');
        return '<div class="section-label">' + esc(g) + '</div><div class="list">' + itemsHtml + '</div>';
      }).join('');
      body = sectionsHtml || '<div class="empty-state">Nessuna segnalazione.</div>';
    }
    var addBtn = '<button class="btn-round" onclick="App.openModal(\'scorta\')">+</button>';
    return '<div>' + renderTopBarWithAction('Scorte', addBtn) + '<div class="chip-row">' + chips + '</div>' + body + '</div>';
  }
