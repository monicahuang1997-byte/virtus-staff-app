  // -- Azioni --
  function rtOpen(){
    var lun = fmtDate(addDays(mondayOf(new Date()), 7));
    state.rtForm = { data: lun, scelta: '', modello: '', dalle: 9, alle: 15, riposo: false, motivo: '' };
    state.activeModal = 'rt_richiesta';
    render();
  }
  function rtField(k, v, rerender){ if (state.rtForm) { state.rtForm[k] = v; if (rerender) render(); } }
  function rtPick(i){
    var f = state.rtForm;
    if (!f) return;
    if (i === -1) { f.scelta = 'custom'; f.modello = ''; f.riposo = false; }
    else if (i === -2) { f.scelta = 'riposo'; f.modello = ''; f.riposo = true; }
    else { var m = plModelli()[i]; if (!m) return; f.scelta = 'm' + i; f.modello = m.nome; f.dalle = m.oi; f.alle = m.of; f.riposo = false; }
    render();
  }
  function rtOra(k, h){
    var f = state.rtForm;
    if (!f) return;
    f[k] = h;
    if (f.alle <= f.dalle) { if (k === 'dalle') f.alle = Math.min(HOUR_END, f.dalle + 1); else f.dalle = Math.max(HOUR_START, f.alle - 1); }
    render();
  }
  function rtInvia(){
    var f = state.rtForm;
    if (!f || state.busy) return;
    if (!f.data) { alert('Scegli il giorno'); return; }
    if (f.data < todayStr()) { alert('Il giorno scelto è già passato.'); return; }
    if (!f.scelta) { alert('Scegli il turno che vorresti (o il giorno di riposo).'); return; }
    var data = { Dipendente: state.user.nome, Data: f.data, Motivo: (f.motivo || '').trim() };
    if (f.riposo) data.Riposo = true;
    else { data.Modello = f.modello; data.Dalle = hourLabel(f.dalle); data.Alle = hourLabel(f.alle); }
    state.busy = true;
    render();
    apiPost({ sheet: 'Richieste_Turno', data: data }).then(asAfter('Richieste_Turno', 'Richiesta inviata alla titolare ✅'));
  }
  function rtOpenLista(){ ensureLoaded('Richieste_Turno'); state.activeModal = 'rt_lista'; render(); }
  function rtApri(id){ state.rtDett = id; state.activeModal = 'rt_dett'; render(); }
  function rtFind(id){ return rtRows().find(function(r){ return String(r.id) === String(id); }); }
  function rtFine(res){
    state.busy = false;
    if (!res || res.error) { if (!(res && res.auth)) alert((res && res.error) || 'Errore'); render(); return; }
    if (state.activeModal === 'rt_dett') state.activeModal = null;
    reload('Turni');
    reload('Richieste_Turno');
    render();
  }
  function rtApprova(id){
    var r = rtFind(id);
    if (!r || state.busy) return;
    var upd = { sheet: 'Richieste_Turno', action: 'update', id: r.id, data: { Stato: 'approvata' } };
    if (r.riposo) { state.busy = true; render(); apiPost(upd).then(rtFine); return; }
    if (!state.cache.Turni) { ensureLoaded('Turni'); alert('Sto caricando i turni, riprova tra un attimo.'); return; }
    var oi = parseHourStr(r.dalle), of = parseHourStr(r.alle);
    var esistenti = plShiftsOf(r.nome, r.data);
    var gia = esistenti.some(function(s){ return s.oi === oi && s.of === of; });
    var daTogliere = [];
    if (esistenti.length && !gia) {
      if (!confirm(r.nome + ' ' + rtGiorno(r.data) + ' ha già: ' + esistenti.map(function(s){ return hourLabel(s.oi) + '–' + hourLabel(s.of); }).join(', ') +
        '.\n\nOK = sostituiscilo con ' + rtCosa(r) + '\nAnnulla = non fare niente')) return;
      daTogliere = esistenti;
    }
    state.busy = true;
    render();
    var chain = Promise.resolve({ ok: true });
    function step(fn){ chain = chain.then(function(prev){ return prev && prev.error ? prev : fn(); }); }
    daTogliere.forEach(function(s){ step(function(){ return apiPost({ sheet: 'Turni', action: 'delete', id: s.id }); }); });
    if (!gia) step(function(){
      return apiPost({ sheet: 'Turni', data: { Data: r.data, 'Ora inizio': hourLabel(oi), 'Ora fine': hourLabel(of), Dipendente: r.nome,
        Modello: r.modello || '', Note: r.motivo ? 'Richiesto: ' + r.motivo : 'Richiesto dal dipendente', 'Creato da': state.user.nome } });
    });
    step(function(){ return apiPost(upd); });
    chain.then(rtFine);
  }
  function rtRifiuta(id){
    var r = rtFind(id);
    if (!r || state.busy) return;
    var motivo = prompt('Vuoi scrivere una risposta a ' + r.nome + '? (facoltativo)', '');
    if (motivo === null) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Richieste_Turno', action: 'update', id: r.id, data: { Stato: 'rifiutata', Risposta: motivo.trim() } }).then(rtFine);
  }
  function rtAnnulla(id){
    var r = rtFind(id);
    if (!r || state.busy) return;
    if (!confirm((r.stato === 'in attesa' ? 'Annullare' : 'Eliminare') + ' la richiesta di ' + rtGiorno(r.data) + '?')) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Richieste_Turno', action: 'delete', id: r.id }).then(rtFine);
  }

    return open + header('📝 Chiedi un turno') +

      '<div class="field-label">Cosa vorresti</div><div class="pl-model-list">' + opts + extra(-1, '🕐 Orario personalizzato', 'custom') + extra(-2, '😴 Giorno di riposo', 'riposo') + '</div>' +
      (f.scelta === 'custom' ? '<div class="field-label">Dalle</div>' + plHourChips(f.dalle, HOUR_START, HOUR_END - 1, 'rtOra', 'dalle') +

  function dashMieiTurni(){
    var c = state.cache;
    if (!c.Turni) return DASH_LOAD;
    var me = state.user.nome, out = '';
    for (var i = 0; i < 5; i++) {
      var dt = addDays(new Date(), i), ds = fmtDate(dt);
      var sh = plShiftsOf(me, ds), a = c.Assenze ? asOn(me, ds, false)[0] : null, body;
      if (sh.length) body = sh.map(function(s){
        var col = plColor(s.modello, s.oi);
        return '<div class="dash-shift" style="background:' + col.bg + ';border-color:' + col.bd + ';color:' + col.fg + ';"><b>' + hourLabel(s.oi) + ' – ' + hourLabel(s.of) + '</b>' + (s.modello ? '<span>' + esc(s.modello) + '</span>' : '') + '</div>';
      }).join('');
      else if (a) { var ac = asColore(a.tipo); body = '<div class="dash-shift" style="background:' + ac.bg + ';border-color:' + ac.bd + ';color:' + ac.fg + ';"><b>' + esc(a.tipo) + '</b></div>'; }
      else body = '<div class="dash-rest">Riposo</div>';
      var lbl = i === 0 ? 'Oggi' : i === 1 ? 'Domani' : GIORNI_LABELS[(dt.getDay()+6)%7] + ' ' + dt.getDate();
      out += '<div class="dash-day' + (i === 0 ? ' dash-today' : '') + '"><div class="dash-day-label">' + lbl + '</div><div class="dash-day-body">' + body + '</div></div>';
    }
    // Totale della settimana in corso (da lunedì a domenica)
    var lun = mondayOf(new Date()), settimana = [];
    for (var k = 0; k < 7; k++) settimana.push(fmtDate(addDays(lun, k)));
    var oreSett = plOreSett(me, settimana);
    var ym = todayStr().slice(0, 7), oreMese = plOreSett(me, rpGiorniMese(ym));
    out += '<div class="dash-day" style="padding-top:10px;"><div class="dash-day-label" style="padding-top:2px;">Le mie ore</div>' +
      '<div class="dash-day-body" style="font-size:13px;"><div><b>' + fmtOre(oreSett) + ' h</b> questa settimana · <b>' + fmtOre(oreMese) + ' h</b> a ' +
      MESI_LUNGHI[new Date().getMonth()].toLowerCase() + '</div></div></div>';
    return out;
  }

  function dashOggi(){
    var c = state.cache;
    if (!c.Turni) return DASH_LOAD;
    var ds = todayStr(), now = new Date(), h = now.getHours() + now.getMinutes() / 60;
    var list = c.Turni.filter(function(r){ return String(val(r,'data')).slice(0,10) === ds; }).map(function(r){
      return { nome: String(val(r,'dipendente')||'').trim(), oi: parseHourStr(val(r,'ora inizio')), of: parseHourStr(val(r,'ora fine')), modello: String(val(r,'modello')||'') };
    }).filter(function(x){ return x.nome && x.oi != null && x.of != null; }).sort(function(a,b){ return a.oi - b.oi; });
    // Una riga per persona, con tutti i suoi orari di oggi (es. pranzo e cena)
    var perNome = {}, ordine = [];
    list.forEach(function(x){
      if (!perNome[x.nome]) { perNome[x.nome] = { nome: x.nome, turni: [] }; ordine.push(x.nome); }
      perNome[x.nome].turni.push(x);
    });
    function riga(p, live){
      var pc = personColor(p.nome);
      return '<div class="dash-person"><span class="dash-av" style="background:' + pc.bg + ';color:' + pc.fg + ';">' + esc(initials(p.nome)) + '</span>' +
        (live ? '<span class="dash-live"></span>' : '') + esc(p.nome) + '<small>' + p.turni.map(function(x){ return hourLabel(x.oi) + '–' + hourLabel(x.of); }).join(' · ') + '</small></div>';
    }
    var persone = ordine.map(function(n){ return perNome[n]; });
    var ora = persone.filter(function(p){ return p.turni.some(function(x){ return x.oi <= h && h < x.of; }); });
    var dopo = persone.filter(function(p){ return ora.indexOf(p) === -1 && p.turni.some(function(x){ return x.oi > h; }); });
    var html = '';
    if (ora.length) html += '<div class="dash-group">In turno adesso</div>' + ora.map(function(x){ return riga(x, true); }).join('');
    if (dopo.length) html += '<div class="dash-group">Più tardi</div>' + dopo.map(function(x){ return riga(x, false); }).join('');
    if (!ora.length && !dopo.length) html += '<div class="dash-empty">' + (list.length ? 'I turni di oggi sono finiti.' : 'Nessun turno oggi.') + '</div>';
    if ((isManager(state.user) || canManageTurni(state.user)) && c.Assenze) {
      var ass = asRows().filter(function(a){ return a.stato === 'approvata' && a.dal <= ds && a.al >= ds; });
      if (ass.length) html += '<div class="dash-group">Assenti oggi</div>' + ass.map(function(a){
        var pc = personColor(a.nome);
        return '<div class="dash-person"><span class="dash-av" style="background:' + pc.bg + ';color:' + pc.fg + ';opacity:0.55;">' + esc(initials(a.nome)) + '</span>' + esc(a.nome) +
          '<small>' + esc(a.tipo) + '</small></div>';
      }).join('');
    }
    var ev = evRows().filter(function(e){ return e.dal <= ds && (e.al || e.dal) >= ds; });
    if (ev.length) html += '<div class="dash-group">Evento di oggi</div>' + ev.map(function(e){ return '<div class="dash-person">' + iconaS('stella') + ' <b>' + esc(e.titolo) + '</b><small>' + esc(e.ora) + '</small></div>'; }).join('');
    return html;
  }

  function dashChecklist(li, fi){ state.filters.locale = LOCALI[li]; state.filters.fase = FASI[fi]; goto('checklist'); }
  function dashDaFare(){
    var c = state.cache, tit = isTitolare(state.user), man = isManager(state.user), html = '';
    function todo(icon, label, n, onclick){
      return '<button class="dash-todo" onclick="' + onclick + '">' + icona(icon) + label + '<b' + (n ? ' style="color:var(--danger);"' : '') + '>' + n + '</b></button>';
    }
    if (tit) {
      if (c.Assenze) { var nf = asRows().filter(function(a){ return a.stato === 'in attesa'; }).length; if (nf) html += todo('ombrellone', 'Ferie e permessi da approvare', nf, 'App.goto(\'assenze\');App.asSetTab(\'approva\')'); }
      if (c.Richieste_Turno) { var nt = rtPending().length; if (nt) html += todo('matita', 'Richieste di turno', nt, 'App.goto(\'planner\');App.rtOpenLista()'); }
    }
    if (man) {
      if (c.Scorte) { var ns = c.Scorte.filter(function(r){ return String(val(r,'stato')||'').toLowerCase().indexOf('risolt') !== 0; }).length; if (ns) html += todo('scatola', 'Prodotti da ordinare', ns, 'App.goto(\'scorte\')'); }
      if (c.Manutenzione) { var nm = c.Manutenzione.filter(function(r){ return String(val(r,'stato')||'').toLowerCase().indexOf('risolt') !== 0; }).length; if (nm) html += todo('chiave_inglese', 'Guasti aperti', nm, 'App.goto(\'manutenzione\')'); }
    }
    // Checklist di oggi: avanzamento per locale e fase
    if (c.Checklist && c.Checklist_Log) {
      var t = todayStr(), righe = '';
      LOCALI.forEach(function(l, li){
        FASI.forEach(function(f, fi){
          var voci = c.Checklist.filter(function(it){ return String(val(it,'locale')).trim().toLowerCase() === l.toLowerCase() && String(val(it,'fase')).trim().toLowerCase() === f; });
          if (!voci.length) return;
          var fatte = voci.filter(function(it){
            var att = String(val(it,'attività') || val(it,'attivita'));
            return c.Checklist_Log.some(function(lg){
              return String(val(lg,'data')) === t && String(val(lg,'locale')).trim().toLowerCase() === l.toLowerCase() &&
                String(val(lg,'fase')).trim().toLowerCase() === f && String(val(lg,'attività') || val(lg,'attivita')) === att;
            });
          }).length;
          var pct = Math.round(fatte / voci.length * 100);
          righe += '<button class="dash-todo" onclick="App.dashChecklist(' + li + ',' + fi + ')">' + icona('checklist') + esc(l) + ' · ' + f +
            '<span class="dash-prog"><i style="width:' + pct + '%;"></i></span><b style="margin-left:6px;">' + fatte + '/' + voci.length + '</b></button>';
        });
      });
      if (righe) html += '<div class="dash-group" style="margin-top:' + (html ? '10px' : '0') + ';">Checklist di oggi</div>' + righe;
    }
    return html || '<div class="dash-empty">Tutto in ordine ✨</div>';
  }

  function dashBacheca(){

  function dashFerie(){

  }

  // ---------- Eventi del circolo (tornei, feste, chiusure…) ----------
  var evMemo = { src: null, rows: [] };
  function evRows(){
    var src = state.cache.Eventi;
    if (evMemo.src === src) return evMemo.rows;
    evMemo.src = src;
    evMemo.rows = (src || []).map(function(r){
      var dal = String(val(r,'dal')||'').slice(0,10);
      return { id: r[findKey(r,'ID')], titolo: String(val(r,'titolo')||'').trim(), dal: dal, al: String(val(r,'al')||'').slice(0,10) || dal,
        ora: String(val(r,'ora')||''), luogo: String(val(r,'luogo')||''),
        descrizione: String(val(r,'descrizione')||'') || String(val(r,'note')||''), foto: String(val(r,'foto')||'').trim(),
        autore: String(val(r,'creato da')||'').trim(), pubblicato: String(val(r,'pubblicato il')||'').slice(0,10) };
    }).filter(function(e){ return e.titolo && e.dal; }).sort(function(a,b){ return a.dal.localeCompare(b.dal); });
    return evMemo.rows;
  }
  function evDi(ds){ return evRows().filter(function(e){ return e.dal <= ds && e.al >= ds; }); }
  function evQuando(e){
    var d1 = parseDate(e.dal), d2 = parseDate(e.al);
    var s = e.dal === e.al ? GIORNI_LABELS[(d1.getDay()+6)%7] + ' ' + d1.getDate() + ' ' + MESI_SHORT[d1.getMonth()]
      : d1.getDate() + ' ' + MESI_SHORT[d1.getMonth()] + ' – ' + d2.getDate() + ' ' + MESI_SHORT[d2.getMonth()];
    return s + (e.ora ? ' · ' + e.ora : '');
  }
  // -- Reazioni agli eventi (🎉 👏 ❤️ 🎾) --
  var EV_REAZIONI = ['🎉', '👏', '❤️', '🎾'];
  function evReazioni(id){
    var me = state.user.nome.toLowerCase(), out = {};
    EV_REAZIONI.forEach(function(em){ out[em] = { n: 0, mia: false }; });
    (state.cache.Reazioni_Eventi || []).forEach(function(r){
      if (String(val(r,'evento')) !== String(id)) return;
      var em = String(val(r,'emoji'));
      if (!out[em]) return;
      out[em].n++;
      if (String(val(r,'persona')||'').toLowerCase() === me) out[em].mia = true;
    });
    return out;
  }
  function evReagisci(id, i){
    var em = EV_REAZIONI[i];
    if (!em || !state.cache.Reazioni_Eventi) return;
    var me = state.user.nome, rows = state.cache.Reazioni_Eventi;
    // Aggiorno subito lo schermo, poi salvo
    var idx = rows.findIndex(function(r){ return String(val(r,'evento')) === String(id) && String(val(r,'emoji')) === em && String(val(r,'persona')||'').toLowerCase() === me.toLowerCase(); });
    if (idx !== -1) rows.splice(idx, 1); else rows.push({ ID: 'tmp', Evento: String(id), Persona: me, Emoji: em });
    state.cache.Reazioni_Eventi = rows.slice();
    render();
    apiPost({ action: 'reazione', evento: String(id), emoji: em, nome: me });
  }
  function evDataPub(e){
    if (!e.pubblicato) return '';
    var d = parseDate(e.pubblicato);
    return d.getDate() + ' ' + MESI_SHORT[d.getMonth()] + ' ' + d.getFullYear();
  }
  // Evento come "post": titolo, autore, testo, data/luogo, foto, reazioni
  function evPostHtml(e, opts){
    opts = opts || {};
    var rx = evReazioni(e.id), pc = personColor(e.autore || 'Virtus');
    var autore = e.autore ? '<div class="ev-post-a"><span class="dash-av" style="background:' + pc.bg + ';color:' + pc.fg + ';">' + esc(initials(e.autore)) + '</span>' +
      esc(e.autore) + (e.pubblicato ? ' · ' + evDataPub(e) : '') + '</div>' : '';
    return '<div class="ev-post' + (opts.flat ? ' ev-post-flat' : '') + '">' +
      '<div class="row-between"><div class="ev-post-t">' + esc(e.titolo) + '</div>' +
      (isTitolare(state.user) && !opts.noEdit ? '<button class="dash-link" onclick="App.evOpen(\'' + esc(e.id) + '\')">Modifica</button>' : '') + '</div>' +
      autore +
      (e.descrizione ? '<div class="ev-post-d">' + esc(e.descrizione) + '</div>' : '') +
      '<div class="ev-chips"><span class="ev-chip">' + iconaS('calendario') + esc(evQuando(e)) + '</span>' +
      (e.luogo ? '<span class="ev-chip">' + iconaS('pin') + esc(e.luogo) + '</span>' : '') + '</div>' +
      (e.foto ? '<img class="ev-img" src="' + esc(e.foto) + '" alt="" loading="lazy" referrerpolicy="no-referrer"/>' : '') +
      '<div class="ev-rx">' + EV_REAZIONI.map(function(em, i){
        var r = rx[em];
        return '<button class="' + (r.mia ? 'on' : '') + '" onclick="App.evReagisci(\'' + esc(e.id) + '\',' + i + ')">' + em + (r.n ? ' <b>' + r.n + '</b>' : '') + '</button>';
      }).join('') + '</div></div>';
  }

  // -- Pagina "Eventi": tutti i post, in programma e passati --
  function renderEventi(){
    ensureLoaded('Eventi');
    ensureLoaded('Reazioni_Eventi');
    var add = isTitolare(state.user) ? '<button class="btn-round" onclick="App.evOpen(\'\')">+</button>' : '';
    var top = renderTopBarWithAction('Eventi', add);
    if (!state.cache.Eventi || !state.cache.Reazioni_Eventi) return '<div>' + top + '<div class="center-loading">Carico gli eventi…</div></div>';
    var t = todayStr(), prossimi = evRows().filter(function(e){ return e.al >= t; });

    return '<div class="ev-feed">' + top +
      (prossimi.length ? prossimi.map(function(e){ return evPostHtml(e); }).join('') :
        '<div class="empty-state">Nessun evento in programma.' + (isTitolare(state.user) ? '<br>Tocca + per pubblicare un torneo, una festa o una chiusura.' : '') + '</div>') +

      '</div>';

  function dashEventi(){
    ensureLoaded('Reazioni_Eventi');
    if (!state.cache.Eventi) return DASH_LOAD;
    var t = todayStr(), list = evRows().filter(function(e){ return e.al >= t; }).slice(0, 4);
    if (!list.length) return '<div class="dash-empty">Nessun evento in programma.' + (isTitolare(state.user) ? ' Aggiungi tornei, feste o chiusure con "+ Aggiungi".' : '') + '</div>';
    // Il prossimo evento in grande, come un post; gli altri in elenco

      var d = parseDate(e.dal);

        '<div style="min-width:0;"><div class="dash-ev-t">' + esc(e.titolo) + '</div><div class="dash-ev-s">' + esc(evQuando(e)) + (e.luogo ? ' · ' + iconaS('pin') + ' ' + esc(e.luogo) : '') + '</div></div></button>';
    }).join('');
  }
  function evOpen(id){
    var e = id ? evRows().find(function(x){ return String(x.id) === String(id); }) : null;
    state.evForm = e ? { id: e.id, titolo: e.titolo, dal: e.dal, al: e.al === e.dal ? '' : e.al, ora: e.ora, luogo: e.luogo, descrizione: e.descrizione, foto: e.foto }
      : { id: '', titolo: '', dal: todayStr(), al: '', ora: '', luogo: '', descrizione: '', foto: '' };
    state.activeModal = isTitolare(state.user) ? 'ev_form' : 'ev_dett';
    render();
  }
  function evField(k, v){ if (state.evForm) state.evForm[k] = v; }
  function evLuogo(i){ if (state.evForm) { state.evForm.luogo = EV_LUOGHI[i]; render(); } }
  var EV_LUOGHI = ['Bar interno', 'Bar piscina', 'Ristorante', 'Campi da tennis', 'Tutto il circolo'];
  function evSalva(){
    var f = state.evForm;
    if (!f || state.busy) return;
    if (!String(f.titolo || '').trim()) { alert('Scrivi il nome dell\'evento'); return; }
    if (!f.dal) { alert('Scegli la data'); return; }
    if (f.al && f.al < f.dal) { alert('La data di fine è prima di quella di inizio.'); return; }
    if (f.caricando) { alert('Attendi la fine del caricamento della foto.'); return; }
    var data = { Titolo: f.titolo.trim(), Dal: f.dal, Al: f.al || f.dal, Ora: String(f.ora || '').trim(), Luogo: String(f.luogo || '').trim(),
      Descrizione: String(f.descrizione || '').trim(), Foto: f.foto || '' };
    var req = f.id ? { sheet: 'Eventi', action: 'update', id: f.id, data: data } : { sheet: 'Eventi', data: Object.assign(data, { 'Creato da': state.user.nome }) };
    state.busy = true;
    render();
    apiPost(req).then(function(res){
      state.busy = false;
      if (!res || res.error) { if (!(res && res.auth)) alert((res && res.error) || 'Errore'); render(); return; }
      state.activeModal = null;
      reload('Eventi');
      render();
    });
  }
  function evElimina(){
    var f = state.evForm;
    if (!f || !f.id || state.busy || !confirm('Eliminare l\'evento "' + f.titolo + '"?')) return;
    state.busy = true;
    render();
    apiPost({ sheet: 'Eventi', action: 'delete', id: f.id }).then(function(res){
      state.busy = false;
      if (!res || res.error) { if (!(res && res.auth)) alert((res && res.error) || 'Errore'); render(); return; }
      state.activeModal = null;
      reload('Eventi');
      render();
    });
  }
  // Foto: la rimpicciolisco nel telefono/computer (max 1200 px) e la carico su Drive
  function evFoto(input){
    var f = state.evForm, file = input && input.files && input.files[0];
    if (!f || !file) return;
    if (!/^image\//.test(file.type)) { alert('Scegli un\'immagine (foto).'); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();

        var max = 1200, sc = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var dati = cv.toDataURL('image/jpeg', 0.82);
        f.caricando = true; f.anteprima = dati;
        render();
        apiPost({ action: 'foto_evento', dati: dati }).then(function(res){

          f.foto = res.url;
          render();
        });
      };
      img.onerror = function(){ alert('Non riesco a leggere questa immagine.'); };
      img.src = reader.result;
    };

  // ---------- Report ore per persona (ore previste dai turni + assenze) ----------
  function rpGiorniMese(ym){
    var p = ym.split('-'), y = +p[0], m = +p[1] - 1, n = new Date(y, m + 1, 0).getDate(), out = [];
    for (var d = 1; d <= n; d++) out.push(fmtDate(new Date(y, m, d)));
    return out;
  }
  function rpDatiPersona(p, ym){
    var days = rpGiorniMese(ym), righe = [], settimane = [], perTipo = {}, perModello = {};
    var tot = { ore: 0, giorniLav: 0, giorniAss: 0, oreContratto: 0 };
    var sett = null;
    days.forEach(function(ds){
      var dt = parseDate(ds), lun = fmtDate(mondayOf(dt));
      if (!sett || sett.lun !== lun) { sett = { lun: lun, ore: 0, giorni: 0, prima: ds, ultima: ds }; settimane.push(sett); }
      sett.giorni++; sett.ultima = ds;
      var shifts = plShiftsOf(p.nome, ds), ore = 0;
      shifts.forEach(function(s){
        var h = s.of - s.oi; ore += h;
        var k = s.modello || 'Orario personalizzato';
        perModello[k] = (perModello[k] || 0) + h;
      });
      var a = asOn(p.nome, ds, false)[0] || null;
      if (a) {
        var t = asTipo(a.tipo), conta = !t.aOre && !(dt.getDay() === 0 && !asContaDomeniche()) && !festivoNome(ds);
        if (!perTipo[a.tipo]) perTipo[a.tipo] = { giorni: 0, ore: 0, colore: t.colore };
        if (t.aOre || a.dalle) { if (a.dal === ds) perTipo[a.tipo].ore += a.ore; }
        else if (conta) { perTipo[a.tipo].giorni++; tot.giorniAss++; }
      }
      if (shifts.length) tot.giorniLav++;
      tot.ore += ore; sett.ore += ore;
      righe.push({ ds: ds, dt: dt, shifts: shifts, ore: ore, assenza: a, festivo: festivoNome(ds), settimana: sett });
    });
    // Contratto proporzionato ai giorni della settimana che cadono nel mese
    settimane.forEach(function(s){ s.contratto = p.ore ? p.ore * s.giorni / 7 : 0; tot.oreContratto += s.contratto; });
    return { righe: righe, settimane: settimane, tot: tot, perTipo: perTipo, perModello: perModello };
  }

      return '<div><span><i style="background:' + col.bg + ';border-color:' + col.bd + ';"></i>' + esc(k) + '</span><b>' + fmtOre(r.perModello[k]) + ' h</b></div>';

      '<div class="as-card"><div class="as-title" style="font-size:14px;">Ore per tipo di turno</div><div class="rp-list">' + (modHtml || '<div><span class="as-item-sub" style="margin:0;">Nessun turno</span></div>') + '</div></div></div>';

    // Numeri chiave
    var diff = r.tot.ore - r.tot.oreContratto;
    var kpis = '<div class="rp-kpis">' +
      '<div class="rp-kpi"><b>' + fmtOre(r.tot.ore) + ' h</b><span>ore previste nel mese</span></div>' +

    var link = document.createElement('a');

  var FORNITORE_KEYWORDS = [
    { k: 'new catering', v: 'New Catering' },
    { k: 'catering', v: 'New Catering' },
    { k: 'partesa', v: 'Partesa' },
    { k: 'vini', v: 'Vini' },

  ];
  function afterKeyword(text, keyword){
    var idx = text.indexOf(keyword);
    return text.slice(idx + keyword.length);
  }
  function cleanSpoken(s){
    s = String(s||'').replace(/^[\s,:;-]+/, '').replace(/^(nella lista|nella|lista|di|del|della|dei|delle)\s+/,'').trim();
    if (!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function runVoiceCommand(rawText){
    var text = rawText.toLowerCase().trim();
    var feedback = 'Non ho capito il comando, riprova.';

    if (text.indexOf('vai a') !== -1 || text.indexOf('apri') !== -1) {
      var screenMap = { turni: 'turni', checklist: 'checklist', bacheca: 'bacheca', vendita: 'vendita', scort: 'scorte', manutenzione: 'manutenzione', document: 'documenti' };
      var foundKey = Object.keys(screenMap).find(function(k){ return text.indexOf(k) !== -1; });
      if (foundKey) { state.screen = screenMap[foundKey]; state.activeModal = null; feedback = 'Ok, apro ' + screenMap[foundKey] + '.'; }
    } else if (text.indexOf('scort') !== -1) {
      var fm = FORNITORE_KEYWORDS.find(function(f){ return text.indexOf(f.k) !== -1; });
      var fornitore = fm ? fm.v : '';
      var rest = fm ? afterKeyword(text, fm.k) : text.replace(/.*scort[ae]/, '');
      rest = rest.replace(/^(aggiungimi|aggiungi)\s*/,'');
      var prodotto = cleanSpoken(rest);
      if (!prodotto) { state.voiceFeedback = 'Dimmi anche il prodotto da segnalare, es. "scorte Partesa acqua naturale in plastica".'; render(); return; }
      state.busy = true;
      apiPost({ sheet: 'Scorte', data: { Data: todayStr(), 'Segnalato da': state.user.nome, Fornitore: fornitore, Prodotto: prodotto, Note: '', Stato: 'da ordinare' } })
        .then(function(){ state.busy = false; reload('Scorte'); });
      feedback = 'Aggiunto a Scorte' + (fornitore ? ' (' + fornitore + ')' : '') + ': "' + prodotto + '".';
    } else if (text.indexOf('guast') !== -1 || text.indexOf('rott') !== -1 || text.indexOf('manutenzione') !== -1) {
      var localeMatch = LOCALI.find(function(l){ return text.indexOf(l.toLowerCase()) !== -1; });
      var restG = text.replace(/.*(guasto|guasta|rotto|rotta|manutenzione)/, '').replace(/^(aggiungimi|aggiungi|segnala)\s*/,'');
      var problema = cleanSpoken(restG);
      if (!problema) { state.voiceFeedback = 'Dimmi anche il problema da segnalare.'; render(); return; }
      state.busy = true;
      apiPost({ sheet: 'Manutenzione', data: { Data: todayStr(), 'Segnalato da': state.user.nome, Locale: localeMatch || LOCALI[0], Problema: problema, Note: '', Stato: 'aperto' } })
        .then(function(){ state.busy = false; reload('Manutenzione'); });
      feedback = 'Segnalato guasto: "' + problema + '".';
    } else if (text.indexOf('avviso') !== -1 || text.indexOf('bacheca') !== -1) {
      var urgente = text.indexOf('urgente') !== -1;
      var restB = text.replace(/.*(avviso|bacheca)/, '').replace(/^(aggiungimi|aggiungi)\s*/,'');
      var messaggio = cleanSpoken(restB);
      if (!messaggio) { state.voiceFeedback = 'Dimmi anche il messaggio da mettere in bacheca.'; render(); return; }
      state.busy = true;
      apiPost({ sheet: 'Bacheca', data: { Data: todayStr(), Autore: state.user.nome, Messaggio: messaggio, 'Priorità': urgente ? 'urgente' : 'normale' } })
        .then(function(){ state.busy = false; reload('Bacheca'); });
      feedback = 'Aggiunto avviso in bacheca: "' + messaggio + '".';
    }

    state.voiceFeedback = feedback;
    render();
  }

  function initSpeech(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      return '<div class="overlay" onclick="App.closeModal()"><div class="sheet" onclick="event.stopPropagation()">' +
        '<div class="sheet-header"><div class="sheet-title">🌴 Segna ferie</div><button class="btn-close" onclick="App.closeModal()">&times;</button></div>' +
        '<div class="field"><div class="field-label">Dal</div><input type="date" value="' + esc(pf.dataInizio) + '" oninput="App.updateFerieRange(\'dataInizio\', this.value)"/></div>' +
        '<div class="field"><div class="field-label">Al</div><input type="date" value="' + esc(pf.dataFine) + '" oninput="App.updateFerieRange(\'dataFine\', this.value)"/></div>' +
        '<div class="field-label">Persona</div>' +
        '<div class="login-list" style="margin-top:6px;">' + (listHtmlF || '<div class="empty-hint">Nessun nominativo trovato.</div>') + '</div>' +
        '</div></div>';
    }

    if (type === 'turnoCell') {
      var c = state.pendingCell;
      if (state.busy) {
        return '<div class="overlay"><div class="sheet">' +
          '<div class="sheet-header"><div class="sheet-title">Aggiungi turno</div></div>' +
          '<div class="center-loading">Salvataggio in corso…</div>' +
          '</div></div>';
      }
      var utenti = (state.cache.Utenti || []).filter(function(u){ return String(val(u,'nome')||'').trim(); });
      var weekStart2 = parseDate(state.turniWeekStart);
      var giornoChips = '';
      for (var di=0; di<7; di++){
        var d2 = addDays(weekStart2, di);
        var ds2 = fmtDate(d2);
        giornoChips += '<button class="chip-select ' + (c.data===ds2?'chip-select-active':'') + '" onclick="App.setPendingData(\'' + ds2 + '\')">' + GIORNI_LABELS[di] + ' ' + d2.getDate() + '</button>';
      }
      var oraInizioOptions = [];
      for (var hi=HOUR_START; hi<HOUR_END; hi++) oraInizioOptions.push(hi);
      var oraInizioChips = oraInizioOptions.map(function(h){
        return '<button class="chip-select ' + (c.oraInizio===h?'chip-select-active':'') + '" onclick="App.setPendingOraInizio(' + h + ')">' + hourLabel(h) + '</button>';
      }).join('');
      var oraFineOptions = [];
      for (var h = c.oraInizio+1; h <= HOUR_END; h++) oraFineOptions.push(h);
      var chipsHtml = oraFineOptions.map(function(h){
        return '<button class="chip-select ' + (c.oraFine===h?'chip-select-active':'') + '" onclick="App.setPendingOraFine(' + h + ')">' + hourLabel(h) + '</button>';
      }).join('');
      var listHtml = utenti.map(function(u){
        var n = val(u,'nome');
        return '<button class="login-btn" onclick="App.assignTurno(\'' + esc(n).replace(/'/g,"\\'") + '\')"><span>' + esc(n) + '</span></button>';
      }).join('');
      var extraHtml = '<button class="login-btn" onclick="App.togglePendingExtra()"><span>+ Persona extra</span></button>' +
        (c.showExtra ? '<div class="field" style="margin-top:10px;"><div class="field-label">Nome della persona</div>' +
          '<input value="' + esc(c.extraName||'') + '" oninput="App.updatePendingExtraName(this.value)" placeholder="Es. Sara (sostituzione)"/></div>' +
          '<button class="btn-submit" onclick="App.assignExtra()">Assegna</button>' : '');
      return '<div class="overlay" onclick="App.closeModal()"><div class="sheet" onclick="event.stopPropagation()">' +
        '<div class="sheet-header"><div class="sheet-title">Aggiungi turno</div><button class="btn-close" onclick="App.closeModal()">&times;</button></div>' +
        '<div class="field-label">Giorno</div><div class="chips-wrap">' + giornoChips + '</div>' +
        '<div class="field-label">Dalle</div><div class="chips-wrap">' + oraInizioChips + '</div>' +
        '<div class="field-label">Fino alle</div><div class="chips-wrap">' + chipsHtml + '</div>' +
        '<div class="field-label">Dipendente</div>' +
        '<div class="login-list" style="margin-top:6px;">' + (listHtml || '<div class="empty-hint">Nessun nominativo trovato.</div>') + '</div>' +
        extraHtml +
        '</div></div>';
    }

    if (type === 'scorta' && state.busy) {
      return '<div class="overlay"><div class="sheet">' +
        '<div class="sheet-header"><div class="sheet-title">Segnala scorta</div></div>' +
        '<div class="center-loading">Salvataggio in corso…</div>' +
        '</div></div>';
    }

    var body = '';

    if (type === 'bacheca') {
      var utentiDest = (state.cache.Utenti || []).filter(function(u){ return String(val(u,'nome')||'').trim(); });
      var destChips = '<button class="chip-select ' + (!f.destinatario?'chip-select-active':'') + '" onclick="App.selectFormChip(\'destinatario\',\'\')">Tutti</button>' +
        utentiDest.map(function(u){
          var n = val(u,'nome');
          return '<button class="chip-select ' + (f.destinatario===n?'chip-select-active':'') + '" onclick="App.selectFormChip(\'destinatario\',\'' + esc(n).replace(/'/g,"\\'") + '\')">' + esc(n) + '</button>';
        }).join('');
      var destinatarioHtml = '<div class="field-label">Per chi</div><div class="chips-wrap">' + destChips + '</div>';
      body = destinatarioHtml +
        '<div class="field"><div class="field-label">Messaggio</div><textarea oninput="App.updateForm(\'messaggio\', this.value)">' + esc(f.messaggio) + '</textarea></div>' +
        '<div class="field-label">Priorità</div><div class="chips-wrap">' + ['normale','urgente'].map(function(p){
          return '<button class="chip-select ' + (f.priorita===p?'chip-select-active':'') + '" onclick="App.selectFormChip(\'priorita\',\'' + p + '\')">' + esc(p) + '</button>';
        }).join('') + '</div>';
    } else if (type === 'scorta') {
      var catalogo = (state.cache.Catalogo_Fornitori || []).filter(function(c){
        return String(val(c,'fornitore')||'').trim().toLowerCase() === f.fornitore.toLowerCase();
      });
      var selezionati = f.selezionati || [];
      var catalogoHtml = catalogo.length ? '<div class="field-label">Prodotti abituali (tocca per selezionare, anche più di uno)</div><div class="chips-wrap">' +
        catalogo.map(function(c){
          var p = val(c,'prodotto');
          var attivo = selezionati.indexOf(p) !== -1;
          return '<button class="chip-select ' + (attivo?'chip-select-active':'') + '" onclick="App.toggleCatalogoProdotto(\'' + esc(p).replace(/'/g,"\\'") + '\')">' + esc(p) + '</button>';
        }).join('') + '</div>' +
        (selezionati.length ? '<button class="btn-submit" style="margin-top:10px;" onclick="App.submitScorteMultipli()">Invia ' + selezionati.length + ' prodott' + (selezionati.length===1?'o':'i') + '</button>' : '')
        : '';
      body = '<div class="field-label">Fornitore</div><div class="chips-wrap">' + FORNITORI.map(function(fo){
          return '<button class="chip-select ' + (f.fornitore===fo?'chip-select-active':'') + '" onclick="App.selectFormChip(\'fornitore\',\'' + fo + '\')">' + esc(fo) + '</button>';
        }).join('') + '</div>' +
        catalogoHtml +
        '<div class="field-label" style="margin-top:16px;">Oppure scrivi un prodotto non in lista</div>' +
        '<div class="field"><div class="field-label">Prodotto</div><input value="' + esc(f.prodotto) + '" oninput="App.updateForm(\'prodotto\', this.value)" placeholder="Es. Prosecco"/></div>' +
        '<div class="field"><div class="field-label">Note (opzionale)</div><input value="' + esc(f.note) + '" oninput="App.updateForm(\'note\', this.value)"/></div>';
    } else if (type === 'guasto') {
      body = '<div class="field-label">Locale</div><div class="chips-wrap">' + LOCALI.map(function(l){
          return '<button class="chip-select ' + (f.locale===l?'chip-select-active':'') + '" onclick="App.selectFormChip(\'locale\',\'' + l + '\')">' + esc(l) + '</button>';
        }).join('') + '</div>' +
        '<div class="field"><div class="field-label">Problema</div><input value="' + esc(f.problema) + '" oninput="App.updateForm(\'problema\', this.value)" placeholder="Es. Macchina caffè non si accende"/></div>' +
        '<div class="field"><div class="field-label">Note (opzionale)</div><input value="' + esc(f.note) + '" oninput="App.updateForm(\'note\', this.value)"/></div>';
    } else if (type === 'nota_turno') {
      body = '<div class="field"><div class="field-label">Scrivi la tua nota o preferenza (es. "Preferisco i turni di mattina", "Non posso il sabato sera")</div>' +
        '<textarea oninput="App.updateForm(\'nota\', this.value)">' + esc(f.nota) + '</textarea></div>';
    } else if (type === 'set_pin') {
      body = '<div class="field-label" style="margin-bottom:14px;">Il PIN (da 4 a 8 cifre) protegge il tuo accesso. Se lo dimentichi, la titolare può cancellarlo dal foglio Utenti e lo reimposti al prossimo accesso.</div>' +
        '<div class="field"><div class="field-label">Nuovo PIN (solo numeri)</div><input type="password" inputmode="numeric" value="' + esc(f.pin) + '" oninput="App.updateForm(\'pin\', this.value)"/></div>' +
        '<div class="field"><div class="field-label">Ripeti il PIN</div><input type="password" inputmode="numeric" value="' + esc(f.pinConfirm) + '" oninput="App.updateForm(\'pinConfirm\', this.value)"/></div>';
    }

    return '<div class="overlay" onclick="App.closeModal()"><div class="sheet" onclick="event.stopPropagation()">' +
      '<div class="sheet-header"><div class="sheet-title">' + MODAL_TITLES[type] + '</div><button class="btn-close" onclick="App.closeModal()">&times;</button></div>' +
      body + '<button class="btn-submit" onclick="App.submitModal()">Salva</button>' +
    '</div></div>';
  }

  function submitModal(){
    var type = state.activeModal, f = state.form;
    if (state.busy) return;

    if (type === 'bacheca') {
      if (!f.messaggio || !f.messaggio.trim()) { alert('Scrivi un messaggio'); return; }
      state.busy = true;
      apiPost({ sheet: 'Bacheca', data: { Data: todayStr(), Autore: state.user.nome, Messaggio: f.messaggio.trim(), 'Priorità': f.priorita, Destinatario: f.destinatario || '' } })
        .then(function(){ state.busy = false; closeModal(); reload('Bacheca'); });
    } else if (type === 'scorta') {
      if (!f.prodotto || !f.prodotto.trim()) { alert('Indica il prodotto'); return; }
      state.busy = true;
      apiPost({ sheet: 'Scorte', data: { Data: todayStr(), 'Segnalato da': state.user.nome, Fornitore: f.fornitore, Prodotto: f.prodotto.trim(), Note: f.note || '', Stato: 'da ordinare' } })
        .then(function(){ state.busy = false; closeModal(); reload('Scorte'); });
    } else if (type === 'guasto') {
      if (!f.problema || !f.problema.trim()) { alert('Descrivi il problema'); return; }
      state.busy = true;
      apiPost({ sheet: 'Manutenzione', data: { Data: todayStr(), 'Segnalato da': state.user.nome, Locale: f.locale, Problema: f.problema.trim(), Note: f.note || '', Stato: 'aperto' } })
        .then(function(){ state.busy = false; closeModal(); reload('Manutenzione'); });
    } else if (type === 'nota_turno') {
      if (!f.nota || !f.nota.trim()) { alert('Scrivi una nota'); return; }
      state.busy = true;
      apiPost({ sheet: 'Note_Turni', data: { Dipendente: state.user.nome, Nota: f.nota.trim(), 'Creato da': state.user.nome } })
        .then(function(){ state.busy = false; closeModal(); reload('Note_Turni'); });
    } else if (type === 'set_pin') {
      if (!f.pin || !f.pin.trim()) { alert('Scrivi un PIN'); return; }
      if (f.pin.trim() !== f.pinConfirm.trim()) { alert('I due PIN non coincidono'); return; }
      if (!/^\d{4,8}$/.test(f.pin.trim())) { alert('Il PIN deve avere da 4 a 8 cifre.'); return; }
      state.busy = true;
      apiPost({ action: 'set_pin', nome: state.user.nome, pin: f.pin.trim() })
        .then(function(res){
          state.busy = false;
          if (!res || res.error) { alert((res && res.error) || 'Errore'); return; }
          state.user.token = res.token;
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.user)); } catch(e){}
          closeModal();
          alert('PIN impostato.');
        });
    }
  }
  function removeNotaTurno(id){
    if (!confirm('Eliminare questa nota?')) return;
    apiPost({ sheet: 'Note_Turni', action: 'delete', id: id }).then(function(res){
      if (res && res.error) { alert(res.error); return; }
      reload('Note_Turni');
    });
  }

  window.App = {
    login: login, logout: logout, goto: goto, goHome: goHome, setFilter: setFilter, enableNotifiche: enableNotifiche, diagnosticaNotifiche: diagnosticaNotifiche,
    selectLoginUser: selectLoginUser, updateLoginPin: updateLoginPin, updateLoginPinConfirm: updateLoginPinConfirm,
    cancelLoginPin: cancelLoginPin, submitLoginPin: submitLoginPin, skipLoginPinSetup: skipLoginPinSetup, submitLoginPinSetup: submitLoginPinSetup,
    checkItem: checkItem, resolveIssue: resolveIssue, removeBacheca: removeBacheca, removeNotaTurno: removeNotaTurno,
    shiftWeek: shiftWeek, openTurnoCell: openTurnoCell, openTurnoAdd: openTurnoAdd, setPendingData: setPendingData,
    setPendingOraInizio: setPendingOraInizio, setPendingOraFine: setPendingOraFine, assignTurno: assignTurno, removeTurno: removeTurno,
    togglePendingExtra: togglePendingExtra, updatePendingExtraName: updatePendingExtraName, assignExtra: assignExtra,
    openFerieRange: openFerieRange, updateFerieRange: updateFerieRange, assignFerieRange: assignFerieRange, removeFerie: removeFerie,
    toggleCatalogoProdotto: toggleCatalogoProdotto, submitScorteMultipli: submitScorteMultipli,
    openModal: openModal, closeModal: closeModal, updateForm: updateForm, selectFormChip: selectFormChip, submitModal: submitModal,
    openVoice: openVoice, closeVoice: closeVoice, toggleListening: toggleListening,
    updateVoiceInputText: updateVoiceInputText, runVoiceInputText: runVoiceInputText,
    plOpenTurno: plOpenTurno, plPickModello: plPickModello, plSetOra: plSetOra, plSaveTurno: plSaveTurno, plDeleteTurno: plDeleteTurno,
    plOpenPersona: plOpenPersona, plPersonaField: plPersonaField, plPersonaChip: plPersonaChip, plSavePersona: plSavePersona, plDeletePersona: plDeletePersona,
    plOpenModelli: plOpenModelli, plModelloField: plModelloField, plModelloSet: plModelloSet, plSaveModello: plSaveModello, plDeleteModello: plDeleteModello,
    plNotifica: plNotifica, plSelectPerson: plSelectPerson,
    plDragStart: plDragStart, plDragOver: plDragOver, plDragLeave: plDragLeave, plDragEnd: plDragEnd, plDrop: plDrop, plDropAzione: plDropAzione,
    plToggleDup: plToggleDup, plDuplica: plDuplica, plSpostaA: plSpostaA,
    rpPersona: rpPersona, rpShiftMonth: rpShiftMonth, rpEsporta: rpEsporta,
    openAltro: openAltro, dashChecklist: dashChecklist, evOpen: evOpen, evReagisci: evReagisci, evFoto: evFoto, evTogliFoto: evTogliFoto, evField: evField, evLuogo: evLuogo, evSalva: evSalva, evElimina: evElimina,
    asSetTab: asSetTab, asShiftYear: asShiftYear, asShiftMonth: asShiftMonth, asOpenRichiesta: asOpenRichiesta,
    asFormField: asFormField, asFormTipo: asFormTipo, asFormPerson: asFormPerson, asFormOra: asFormOra, asInvia: asInvia,
    asDecidi: asDecidi, asAnnulla: asAnnulla, asCellClick: asCellClick, asEditSaldo: asEditSaldo,
    asTipoField: asTipoField, asTipoColore: asTipoColore, asAddTipo: asAddTipo, asDelTipo: asDelTipo,
    asFestField: asFestField, asAddFest: asAddFest, asDelFest: asDelFest, asRegolaField: asRegolaField, asSalvaRegole: asSalvaRegole,
    asEsporta: asEsporta, asShiftCalMonth: asShiftCalMonth, asApriDettaglio: asApriDettaglio,
    rtOpen: rtOpen, rtField: rtField, rtPick: rtPick, rtOra: rtOra, rtInvia: rtInvia, rtOpenLista: rtOpenLista,
    rtApri: rtApri, rtApprova: rtApprova, rtRifiuta: rtRifiuta, rtAnnulla: rtAnnulla,
  };

  document.addEventListener('DOMContentLoaded', function(){
    if (state.user) ensureLoaded('Utenti');
    initSpeech();
    render();
  });
})();
</script>
</body>
